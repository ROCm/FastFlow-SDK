# rocm-npu-staging — version manifest (the pin authority). 2026-06-26.
# Exact revisions the NPU stack is built/validated against. projects/ are
# git submodules; this file records their pins. Build orchestration is in dev.py,
# Python deps in requirements/compiler-stack.txt.
#
# Everything is built FROM SOURCE (submodules) against one ROCm LLVM; Peano
# (llvm-aie) is the ONLY wheel-sourced toolchain piece.

[meta]
host = "linux-x86_64; build + artifact handoff only — on-device run needs an NPU + amdxdna driver"
note = "projects/ are pinned by commit (below); canonical remote URLs are in .gitmodules."

[llvm]                          # projects/llvm-project — ROCm amd-llvm, LLVM 24
repo       = "github.com/ROCm/llvm-project"              # canonical ROCm remote (no fork in the chain)
commit     = "56bcc1871734e6c375a254dec0ec74eb18d04a2e"  # mlir-aie utils/clone-llvm.sh LLVM_PROJECT_COMMIT
branch     = "amd-staging"                               # the commit sits here; pin is the SHA, not the moving tip
llvm_major = 24
train_note = "Deliberate leave of the previous ROCm release train (release/therock-7.14, LLVM 23, 46fcb339 / tag therock-7.14). The pin is still a commit SHA — the LLVM_PROJECT_COMMIT mlir-aie names in utils/clone-llvm.sh — which currently lives on amd-staging as LLVM 24. Not an accidental submodule-tip bump."
patches    = ["patches/llvm-project/0001-link-python-support-to-stable-abi.patch"]
abi3_note  = "0001 makes MLIR's private Python support DLL use Python3::SABIModule when MLIR_ENABLE_PYTHON_STABLE_ABI is enabled; upstream otherwise links Python3_LIBRARY_RELEASE unconditionally on Windows."
win_note   = "Built with the STATIC MSVC runtime on Windows (dev.py passes CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded): mlir-aie sets that unconditionally and lld-link rejects a mixed link. Same CRT upstream builds its own LLVM with (utils/mlir_wheels/setup.py). LLVM_USE_CRT_RELEASE is gone in LLVM 23+."

[iron_tools]                    # projects/iron-tools — built from source against [llvm]
repo     = "github.com/Xilinx/mlir-aie"
commit   = "4c8b56f5db25a9a89582bffed3ad933dea5b1d15"    # nightly 2026-08-25 ("4c8b56f5db")
provides = ["aie-opt", "aie-translate", "aiecc", "IRON python", "bootgen", "aie_api", "aie-rt", "xclbinutil (vendored third_party/hrx-xclbinutil)"]
note     = "Builds against the same ROCm LLVM pin as mlir-aie utils/clone-llvm.sh (56bcc187, LLVM 24). hrx-xclbinutil is vendored in-tree (mlir-aie #3473), no longer a nested git submodule."
e2e_design = "programming_examples/basic/matrix_scalar_add"   # the design `dev.py test` builds
e2e_device = "npu2"                                          # -d passed to that design
patches  = ["patches/iron-tools/0001-eudsl-offline-find-links.patch", "patches/iron-tools/0002-windows-clang-cl.patch", "patches/iron-tools/0005-eudsl-download-no-build-isolation.patch", "patches/iron-tools/0006-mlir-core-type-stubs-from-build-tree.patch", "patches/iron-tools/0007-aiecc-capture-stdio-maybe-unused.patch"]
hrx_note = "The former 0003 (HRX IRON host-runtime, aie.utils.hostruntime.hrxruntime — what IRON_RUNTIME=hrx selects) was dropped at this pin: mlir-aie now ships the HRX IRON path upstream, so the patch is redundant. The former 0005 (gate-xrt-scratchpad-binding) was dropped for the same reason — this iron-tools pin already gates the _parameter_scratchpad pybind11 module behind AIE_ENABLE_XRT_PYTHON_BINDINGS upstream. The former 0004 (HostRuntime.cleanup() on the ABC) is now upstream (mlir-aie #3567 and follow-ups), so it was dropped at this pin. The former 0008/0009 (LLVM 23 DenseMapInfo sentinels and arith-expand includeMinMaxF guard) were dropped by aligning this stack's LLVM pin with mlir-aie's clone-llvm.sh commit."
win_note = "0002 is Windows-only in effect (guards keyed on CMake's MSVC var, empty under gcc/clang): gives /EHsc to everything that throws (bootgen, all four test/CppTests, test_utils) because MSVC-style drivers default exceptions off and clang-cl rejects throw outright, and drops -Werror=sign-compare, which aie-rt trips only because MS-ABI enums are signed. Verified a no-op on Linux: build.ninja is byte-identical with and without it."
win_note2 = "0007 marks CaptureStdio's trivial members ([[maybe_unused]]) in tools/aiecc/Utils.h: they are read only inside the tool's #ifndef _WIN32 stdout/stderr-redirect path, so on Windows the constructor/destructor bodies compile out and clang-cl's -Wunused-private-field (promoted by -Werror=unused) fails the native aiecc build. gcc never emits that clang-only diagnostic, so this is a no-op on Linux."

[iron_ops]                      # projects/iron-ops — the IRON operator library (pure Python)
repo     = "github.com/amd/IRON"
commit   = "aab8083822521ab13cfafc696fe281680f818b78"  # origin/devel 2026-08-25 (#150)
branch   = "devel"                                              # IRON's default branch; main is an empty initial commit
provides = ["iron.operators (GEMM, MHA, RMSNorm, elementwise, ...)", "aie_kernels C++ sources"]
note     = "Consumes the `aie` package + Peano. Upstream takes both from WHEELS (mlir_aie==1.4.2.dev); here it runs against the SOURCE-built iron-tools ([iron_tools] above) and our Peano pin, so its pyproject deps are NOT installed — dev.py installs it --no-deps and requirements/compiler-stack.txt owns numpy/ml_dtypes. WHICH operators are gated (and at what size) is a test matrix, not a pin: build_tools/iron.py OPERATORS (tests/iron-ops/suite.py re-exports it). This pin is required for the mlir-aie Runtime callback-body API (seq_fn) and native aiecc --get-* flags landed in iron-tools 4c8b56f."
patches  = ["patches/iron-ops/0001-xrt-free-host-stack.patch", "patches/iron-ops/0002-lazy-operator-imports.patch", "patches/iron-ops/0004-windows-link-fallback.patch"]
xrt_note = "0001 is what lets IRON run without XRT at all: iron/common/sequence.py did `import pyxrt` (and XRTTensor) at module scope, and test_utils.py named XRTTensor directly + sized buffers with pyxrt's `bo.size()`. The patch makes those imports optional, routes test buffers through aie.utils.DEFAULT_TENSOR_CLASS (HRXTensor here), and takes byte counts from the numpy view. The XRT-native OperatorSequence dispatch policies now raise a clear error instead of failing at import."
lazy_note = "0002 makes iron.operators re-export lazily (PEP 562). Eagerly, importing ANY operator imported ALL of them — including mha (torch) and swiglu (pyxrt) — so the CPU build jobs would have had to install torch just to compile an elementwise add. See requirements/iron-ops-test.txt."
aiecc_note = "The former 0003 (adapt aiecc native CLI) was dropped at this pin: iron-ops #145/#150 now compile through mlir-aie's compile_mlir_module(), which already emits native aiecc --get-* flags. The previous pin still spawned `aiecc.py` with the old Python-driver flags."
win_note = "0004 copies aiecc work-dir inputs when symlink creation is denied (Windows without Developer Mode). CI runners can symlink; a local checkout often cannot."

[peano]                         # the ONLY wheel-sourced toolchain piece (AIE codegen)
wheel = "llvm-aie==21.0.0.2026061501+acc2a72c"
index = "https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly"
note  = "LLVM 21 (lags ROCm's 24). Folding the AIE backend onto ROCm LLVM is future work; until then Peano stays a separate wheel."

[hrx]                           # projects/hrx — amdxdna runtime
repo       = "github.com/ROCm/hrx-system"                # canonical ROCm remote (no fork in the chain)
branch     = "users/jtuyls/amdxdna-hal-native-rel"
commit     = "6867cba992b9022fb8544e18f434f2a25b54ec17"
hal_driver = "runtime/src/iree/hal/drivers/amdxdna"      # Linux KMQ + Windows MCDM; own shim (no XRT)
note       = "Forwards native-rel through origin/main plus host-test compiler compatibility (MSVC vtable init, GCC field initializers, clang-cl range-loop). Direct executable load uses advertised target family/key (amdxdna/amdxdna). Native amdxdna stack with command-chain capability reporting/fallback, Windows MCDM partial-ELF dispatch support, transaction-ordered resolution of reused buffer descriptors, BD address patching that overwrites baked descriptor addresses instead of double-counting offsets, per-submit restaging and stable non-overlapping placement of cached Windows command-aperture contents, persistent cached partial-ELF staging with publication re-established after chain sessions may overwrite shared aperture storage, negotiated legacy/compact Windows MCDM contracts from UMDRIVERPRIVATE adapter info (kmd_version plus PCI hw_type; compact vs two-DWORD is miniport query size, not SKU), STX2 INF disambiguation between legacy_v2 and legacy, ABI-hardened HRX-owned amdxdna XADX executable creation, DDI-owned Windows CPU-write publication, allocation-level KMT coherency for directly mapped host buffers, device-scoped ordinary Windows BO allocation with context deferral limited to command staging, cached Path-B placements, reusable context-owned persistent command-code aperture slots, non-temporal single-command Path-B restaging, range-based cache publication that always opcode-9s the exact Path-B aperture range consumed by the next state-3/chain submit (including cached reuse of unchanged CPU bytes), shape-compatible PARTIAL_ELF chain reuse, unchanged BO-table synchronization elision, bounded chain-child metadata publication, and XRT-style cache-line synchronization for sub-LLC mapped-BO ranges while retaining KMT invalidation for large or unmapped buffers and command-aperture publication, KMT residency diagnostics, preempt-ELF ERT ABI vocabulary, minimal/relocatable runtime component gating, legacy Windows MCDM driver ABI selection for the 32.0.203.240/.280 stacks while preserving the 32.0.203.314/.329 and newer layouts, explicit asynchronous submission ownership, backend-defined chain-cache retention, fail-closed completion-slot accounting, and fence-ordered Path-B parent retirement before miniport completion readback."
windows_perf_note = "Avoids native command/BO construction before retained chain-cache lookup, retains compact-ABI command-aperture mappings and range sessions across context switches, publishes contiguous code through its final queue-ordered opcode-9 boundary, queues safe range releases without a CPU wait, and retires asynchronous batches through one final in-order fence plus one completion-ring invalidation."
host_only_note = "Eager command/context caches before device publication. HOST_ONLY is HOST_VISIBLE|HOST_CACHED|DEVICE_VISIBLE (0x1A); HOST_COHERENT and HOST_LOCAL/DEVICE_LOCAL without OPTIMAL are rejected. FastFlowLM Windows HRX engines at [fastflowlm] request 0x1A directly, so the former 0004 HOST_LOCAL|DEVICE_VISIBLE (0x52/0x56) alias is dropped. Reject non-1x1x1 dispatch and unaligned patch addresses."

[fastflowlm]                    # projects/FastFlowLM — HRX-native LLM inference engine
repo       = "github.com/Abhishek-Varma/FastFlowLM_JT"
upstream   = "github.com/FastFlowLM/FastFlowLM"
branch     = "update_hrx_binaries"
pr         = "FastFlowLM/FastFlowLM#602"
commit     = "81001bbcdef5037ff745b51df5573649b041aa8f"
note       = "HRX-native app path for FastFlowLM 1.0.3 consuming the public HRX amdxdna executable API. Windows engine libraries allocate HOST_VISIBLE|HOST_CACHED|DEVICE_VISIBLE (0x1A) from FastFlowLM_IRON flm_use_hrx_flag 1d4d9a2c; the Linux .so files are the matching manylinux_2_28 rebuild from that same IRON pin (GCC 13.3.1 Red Hat, Boost-free, maximum required GLIBC_2.22 and GLIBCXX_3.4.22). The staging smoke builds this app against projects/hrx and pulls/runs qwen3:0.6b on the NPU. python dev.py build fastflowlm stamps -DFLM_VERSION=1.0.3 so the binary matches CMakePresets.json and qwen3.5/qwen3.6-moe flm_min_version. At 1.0.3 the qwen3.5 (0.8b/2b/4b/9b) and qwen3.6-moe catalog entries also move from the flm_quant to the flm_q4k_high_precision weights, so cached 1.0.2 model files must be re-pulled. This pin also honors caller-provided XRT_INCLUDE_DIR/XRT_LIB_DIR (so `dev.py build fastflowlm-xrt` can produce the XRT-backed comparison binary instead of losing to a mangled distro xrt.pc) and lets `flm run` be driven from a pipe or file rather than blocking in the interactive console reader."

[eudsl]                         # the one build-time-FETCHED package (the aie.extras layer)
package      = "eudsl-python-extras"
version      = "0.1.0.20260801.905+68a0d7a"              # same pin as mlir-aie python/requirements.txt
find_links   = "https://llvm.github.io/eudsl"
sha256       = "e8672fd1b71c4aba56a80fb724a756337d299a4e706a90ceff435138867213c2"  # sdist (verified on fetch)
find_links_via = "patches/iron-tools/0001-eudsl-offline-find-links.patch"
note         = "Prefetch mlir-aie's own eudsl pin (LLVM is aligned with clone-llvm.sh, so the former 20260629 override is gone). 0001 only rewrites -f from https://llvm.github.io/eudsl to .cache/find-links; with dev.py's PIP_FIND_LINKS + PIP_NO_INDEX the vendoring is network-free (sha256-verified prefetched sdist)."

# Reduced hard deps — all SOURCE-built via the iron-tools submodule (NOT wheels):
#   aie_api -> projects/iron-tools/third_party/aie_api  (AIEOPT_DIR for kernel -I)
#   aie-rt  -> projects/iron-tools/third_party/aie-rt
#   bootgen -> built by iron-tools -> build/iron-tools/bin/bootgen  (build-time only, never runtime)
#   eudsl   -> prefetched + verified (see [eudsl]); the only build-time network fetch
#   xrt     -> NONE at runtime (XRT source used only to build hrx-xclbinutil)
#   peano   -> the only wheel (see [peano])
