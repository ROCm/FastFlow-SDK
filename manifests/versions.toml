# rocm-npu-staging — version manifest (the pin authority). 2026-06-26.
# Exact revisions the NPU stack is built/validated against. projects/ are
# git submodules; this file records their pins. Build orchestration is in dev.py,
# Python deps in requirements.txt.
#
# Everything is built FROM SOURCE (submodules) against one ROCm LLVM; Peano
# (llvm-aie) is the ONLY wheel-sourced toolchain piece.

[meta]
host = "linux-x86_64; build + artifact handoff only — on-device run needs an NPU + amdxdna driver"
note = "projects/ are pinned by commit (below); canonical remote URLs are in .gitmodules."

[llvm]                          # projects/llvm-project — ROCm amd-llvm, LLVM 23
repo       = "github.com/jtuyls/llvm-project"            # origin (fork, pushable)
upstream   = "github.com/ROCm/llvm-project"              # remote 'amd' (fetch-only; push disabled)
commit     = "46fcb339fb61119b337f973c7ca9e710a319fdd0"  # ROCm amd-llvm weekly snapshot
branch     = "amd-compiler-ww-2026-17"                   # weekly snapshot the pin sits on (NOT the moving amd-staging)
llvm_major = 23
win_note   = "Built with the STATIC MSVC runtime on Windows (dev.py passes CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded): mlir-aie sets that unconditionally and lld-link rejects a mixed link. Same CRT upstream builds its own LLVM with (utils/mlir_wheels/setup.py). LLVM_USE_CRT_RELEASE is gone in LLVM 23."

[iron_tools]                    # projects/iron-tools — built from source against [llvm]
repo     = "github.com/Xilinx/mlir-aie"
commit   = "14273685bebf296798cc86facd3459b5a017cda7"    # nightly 2026-06-13 ("14273685be")
provides = ["aie-opt", "aie-translate", "aiecc.py", "IRON python", "bootgen", "aie_api", "aie-rt"]
note     = "Builds cleanly against ROCm LLVM (46fcb339); its clone-llvm.sh nominally pins llvm.org ea2f5081 (also LLVM 23)."
e2e_design = "programming_examples/basic/matrix_scalar_add"   # the design `dev.py test` builds
e2e_device = "npu2"                                          # -d passed to that design
patches  = ["patches/iron-tools/0001-eudsl-for-amd-llvm-23.patch", "patches/iron-tools/0002-windows-clang-cl.patch", "patches/iron-tools/0003-add-hrx-iron-path.patch", "patches/iron-tools/0004-hostruntime-cleanup.patch"]
hrx_note = "0003 adds the HRX IRON host-runtime (aie.utils.hostruntime.hrxruntime) — it is what IRON_RUNTIME=hrx selects. 0004 makes cleanup() part of the HostRuntime interface (a no-op by default, real on HRX, where it releases the cached executables): it existed only on CachedXRTRuntime, and callers reached for it directly — iron-ops' conftest does, per test — which silently made them XRT-only."
win_note = "0002 is Windows-only in effect (guards keyed on CMake's MSVC var, empty under gcc/clang): gives /EHsc to everything that throws (bootgen, all four test/CppTests, test_utils) because MSVC-style drivers default exceptions off and clang-cl rejects throw outright, and drops -Werror=sign-compare, which aie-rt trips only because MS-ABI enums are signed. Verified a no-op on Linux: build.ninja is byte-identical with and without it."

[iron_ops]                      # projects/iron-ops — the IRON operator library (pure Python)
repo     = "github.com/amd/IRON"
commit   = "17769b86a9a7dc68fb04ec6636a233b2adb4d543"
provides = ["iron.operators (GEMM, MHA, RMSNorm, elementwise, ...)", "aie_kernels C++ sources"]
note     = "Consumes the `aie` package + Peano. Upstream takes both from WHEELS (mlir_aie==v1.3.4); here it runs against the SOURCE-built iron-tools ([iron_tools] above) and our Peano pin, so its pyproject deps are NOT installed — dev.py installs it --no-deps and requirements.txt owns numpy/ml_dtypes. WHICH operators are gated (and at what size) is a test matrix, not a pin: tests/iron-ops/suite.py."
patches  = ["patches/iron-ops/0001-xrt-free-host-stack.patch", "patches/iron-ops/0002-lazy-operator-imports.patch"]
xrt_note = "0001 is what lets IRON run without XRT at all: iron/common/{utils,sequence}.py did `import pyxrt` at module scope (so even COMPILING an operator needed XRT installed), and test_utils.py named XRTTensor directly + sized buffers with pyxrt's `bo.size()`. The patch makes the pyxrt imports optional, routes test buffers through aie.utils.DEFAULT_TENSOR_CLASS (HRXTensor here), and takes byte counts from the numpy view. The XRT-native OperatorSequence dispatch policies now raise a clear error instead of failing at import."
lazy_note = "0002 makes iron.operators re-export lazily (PEP 562). Eagerly, importing ANY operator imported ALL of them — including mha (torch) and swiglu (pyxrt) — so the CPU build jobs would have had to install torch just to compile an elementwise add. See requirements-iron-ops.txt."

[peano]                         # the ONLY wheel-sourced toolchain piece (AIE codegen)
wheel = "llvm-aie==21.0.0.2026061501+acc2a72c"
index = "https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly"
note  = "LLVM 21 (lags ROCm's 23). Folding the AIE backend onto ROCm LLVM is future work; until then Peano stays a separate wheel."

[hrx]                           # projects/hrx — amdxdna runtime
repo       = "github.com/jtuyls/hrx"                     # fork; upstream ROCm/hrx-system
branch     = "amdxdna-hal-native"                         # == ROCm/hrx-system PR #37 (+ follow-ups)
commit     = "0d9f1a38fe8ad081706d5db2b8a41e827a410aa0"
hal_driver = "runtime/src/iree/hal/drivers/amdxdna"      # Linux KMQ + Windows MCDM; own shim (no XRT)
note       = "Native amdxdna stack with command-chain capability reporting/fallback, Windows MCDM partial-ELF dispatch support, transaction-ordered resolution of reused buffer descriptors, negotiated legacy/compact Windows MCDM contracts, legacy protocol revision 3 support, and minimal-build dependency gating."

[hrx_xclbinutil]                # projects/hrx-xclbinutil — standalone repo (transitional)
repo       = "github.com/jtuyls/hrx-xclbinutil"          # origin remote set; push when ready
branch     = "main"
commit     = "f29b4c9190b7ef1c9d6764b3e064fc2c5db647ce"  # windows/clang-cl support (PR #2)
status     = "transitional — may be upstreamed to mlir-aie / hrx / other later"
xrt_source = "github.com/nod-ai/XRT @ a9fdf618ceba32d28bbf6715a5ee627a51a74b24"  # XRT 2.18.0
note       = "Derived build tool: NPU-minimal xclbinutil + hrx util (no Boost, no XRT install). Builds on Windows with clang-cl ONLY: its vendored aie-pdi-transform sources use GNU extensions (__attribute__((aligned)), void* arithmetic) that MSVC cl rejects."

[fastflowlm]                    # projects/FastFlowLM — HRX-native FastFlowLM PR #602
repo       = "github.com/Abhishek-Varma/FastFlowLM_JT"
upstream   = "github.com/FastFlowLM/FastFlowLM"
branch     = "codex/manylinux-228-engines"
pr         = "FastFlowLM/FastFlowLM#602"
commit     = "72cd41de6829e1226fd1aa7741c0d65a0630a2d3"
note       = "Pinned HRX-native app path for FastFlowLM 0.9.45 with all 22 Linux engine libraries rebuilt for manylinux_2_28 without Boost runtime dependencies (maximum required GLIBC_2.22 and GLIBCXX_3.4.22). The staging smoke builds this app against projects/hrx and pulls/runs qwen3:0.6b on the NPU."

[eudsl]                         # the one build-time-FETCHED package (the aie.extras layer)
package      = "eudsl-python-extras"
version      = "0.1.0.20260629.149+b27b3ae"              # OVERRIDES mlir-aie's own pin (0.1.0.20260418)
find_links   = "https://llvm.github.io/eudsl"
sha256       = "42157b9bc95fbde97d1bc10aefd268b3bc68bc34af6f97a2dd2cb4c1e751104f"  # sdist (verified on fetch)
mlir_aie_pin = "0.1.0.20260418.906+a736a7d"              # what mlir-aie pins (correct for its intended LLVM)
override_via = "patches/iron-tools/0001-eudsl-for-amd-llvm-23.patch"
note         = "TEMPORARY override: mlir-aie's eudsl 04-18 breaks on amd-llvm-23 nanobind (ScalarValue Value(OpResult)); 06-29 fixes it and emits size-identical IR. The patch bumps the version AND repoints mlir-aie's find-links to .cache/find-links; with dev.py's PIP_FIND_LINKS + PIP_NO_INDEX the vendoring is network-free (sha256-verified prefetched sdist). Remove when mlir-aie's Python/IRON path is built against an aligned LLVM."

# Reduced hard deps — all SOURCE-built via the iron-tools submodule (NOT wheels):
#   aie_api -> projects/iron-tools/third_party/aie_api  (AIEOPT_DIR for kernel -I)
#   aie-rt  -> projects/iron-tools/third_party/aie-rt
#   bootgen -> built by iron-tools -> build/iron-tools/bin/bootgen  (build-time only, never runtime)
#   eudsl   -> prefetched + verified (see [eudsl]); the only build-time network fetch
#   xrt     -> NONE at runtime (XRT source used only to build hrx-xclbinutil)
#   peano   -> the only wheel (see [peano])
