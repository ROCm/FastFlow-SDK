# rocm-npu-staging — version manifest (the pin authority). 2026-06-26.
# Exact revisions the NPU stack is built/validated against. projects/ are
# git submodules; this file records their pins. Build orchestration is in dev.py,
# Python deps in requirements/compiler-stack.txt.
#
# Everything is built FROM SOURCE (submodules) against one ROCm LLVM; Peano
# (llvm-aie) is the ONLY wheel-sourced toolchain piece.

[meta]
host = "linux-x86_64; build + artifact handoff only — on-device run needs an NPU + amdxdna driver"
note = "projects/ are pinned by commit (below); canonical remote URLs are in .gitmodules."

[llvm]                          # projects/llvm-project — ROCm amd-llvm, LLVM 23
repo       = "github.com/ROCm/llvm-project"              # canonical ROCm remote (no fork in the chain)
commit     = "46fcb339fb61119b337f973c7ca9e710a319fdd0"  # == tag therock-7.14
branch     = "release/therock-7.14"                      # release branch the pin sits on (NOT the moving amd-staging)
llvm_major = 23
patches    = ["patches/llvm-project/0001-link-python-support-to-stable-abi.patch"]
abi3_note  = "0001 makes MLIR's private Python support DLL use Python3::SABIModule when MLIR_ENABLE_PYTHON_STABLE_ABI is enabled; upstream otherwise links Python3_LIBRARY_RELEASE unconditionally on Windows."
win_note   = "Built with the STATIC MSVC runtime on Windows (dev.py passes CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded): mlir-aie sets that unconditionally and lld-link rejects a mixed link. Same CRT upstream builds its own LLVM with (utils/mlir_wheels/setup.py). LLVM_USE_CRT_RELEASE is gone in LLVM 23."

[iron_tools]                    # projects/iron-tools — built from source against [llvm]
repo     = "github.com/Xilinx/mlir-aie"
commit   = "4976487604d3e5c2f86ed536a9d8a770379b9d42"    # nightly 2026-07-25 ("4976487604")
provides = ["aie-opt", "aie-translate", "aiecc.py", "IRON python", "bootgen", "aie_api", "aie-rt", "xclbinutil (vendored third_party/hrx-xclbinutil)"]
note     = "Builds cleanly against ROCm LLVM (46fcb339); its clone-llvm.sh nominally pins llvm.org ea2f5081 (also LLVM 23)."
e2e_design = "programming_examples/basic/matrix_scalar_add"   # the design `dev.py test` builds
e2e_device = "npu2"                                          # -d passed to that design
patches  = ["patches/iron-tools/0001-eudsl-for-amd-llvm-23.patch", "patches/iron-tools/0002-windows-clang-cl.patch", "patches/iron-tools/0004-hostruntime-cleanup.patch", "patches/iron-tools/0005-eudsl-download-no-build-isolation.patch", "patches/iron-tools/0006-mlir-core-type-stubs-from-build-tree.patch", "patches/iron-tools/0007-aiecc-capture-stdio-maybe-unused.patch"]
hrx_note = "The former 0003 (HRX IRON host-runtime, aie.utils.hostruntime.hrxruntime — what IRON_RUNTIME=hrx selects) was dropped at this pin: mlir-aie now ships the HRX IRON path upstream, so the patch is redundant. The former 0005 (gate-xrt-scratchpad-binding) was dropped for the same reason — this iron-tools pin already gates the _parameter_scratchpad pybind11 module behind AIE_ENABLE_XRT_PYTHON_BINDINGS upstream. 0004 makes cleanup() part of the HostRuntime interface (a no-op by default, real on HRX, where it releases the cached executables): it existed only on CachedXRTRuntime, and callers reached for it directly — iron-ops' conftest does, per test — which silently made them XRT-only."
win_note = "0002 is Windows-only in effect (guards keyed on CMake's MSVC var, empty under gcc/clang): gives /EHsc to everything that throws (bootgen, all four test/CppTests, test_utils) because MSVC-style drivers default exceptions off and clang-cl rejects throw outright, and drops -Werror=sign-compare, which aie-rt trips only because MS-ABI enums are signed. Verified a no-op on Linux: build.ninja is byte-identical with and without it."
win_note2 = "0007 marks CaptureStdio's trivial members ([[maybe_unused]]) in tools/aiecc/Utils.h: they are read only inside the tool's #ifndef _WIN32 stdout/stderr-redirect path, so on Windows the constructor/destructor bodies compile out and clang-cl's -Wunused-private-field (promoted by -Werror=unused) fails the native aiecc build. gcc never emits that clang-only diagnostic, so this is a no-op on Linux."

[iron_ops]                      # projects/iron-ops — the IRON operator library (pure Python)
repo     = "github.com/amd/IRON"
commit   = "17769b86a9a7dc68fb04ec6636a233b2adb4d543"
provides = ["iron.operators (GEMM, MHA, RMSNorm, elementwise, ...)", "aie_kernels C++ sources"]
note     = "Consumes the `aie` package + Peano. Upstream takes both from WHEELS (mlir_aie==v1.3.4); here it runs against the SOURCE-built iron-tools ([iron_tools] above) and our Peano pin, so its pyproject deps are NOT installed — dev.py installs it --no-deps and requirements/compiler-stack.txt owns numpy/ml_dtypes. WHICH operators are gated (and at what size) is a test matrix, not a pin: tests/iron-ops/suite.py."
patches  = ["patches/iron-ops/0001-xrt-free-host-stack.patch", "patches/iron-ops/0002-lazy-operator-imports.patch", "patches/iron-ops/0003-adapt-aiecc-native-cli.patch"]
xrt_note = "0001 is what lets IRON run without XRT at all: iron/common/{utils,sequence}.py did `import pyxrt` at module scope (so even COMPILING an operator needed XRT installed), and test_utils.py named XRTTensor directly + sized buffers with pyxrt's `bo.size()`. The patch makes the pyxrt imports optional, routes test buffers through aie.utils.DEFAULT_TENSOR_CLASS (HRXTensor here), and takes byte counts from the numpy view. The XRT-native OperatorSequence dispatch policies now raise a clear error instead of failing at import."
lazy_note = "0002 makes iron.operators re-export lazily (PEP 562). Eagerly, importing ANY operator imported ALL of them — including mha (torch) and swiglu (pyxrt) — so the CPU build jobs would have had to install torch just to compile an elementwise add. See requirements/iron-ops-test.txt."
aiecc_note = "0003 adapts iron/common/compilation/base.py to the native aiecc CLI shipped by the current iron-tools pin (4976487): the former python aiecc.py driver flags (-v, -j1, --no-compile-host, --aie-generate-xclbin, --aie-generate-npu-insts, --generate-full-elf, --no-compile) become the declarative driver's equivalents (--verbose, -j 1, host compile opt-in via -o, --get-xclbin, --get-npu-insts, --get-full-elf; requesting only the insts edge replaces --no-compile). iron-ops develops against the mlir_aie wheel, so it still emits the old CLI; without this the off-device operator build fails immediately with 'Unknown command line argument'."

[peano]                         # the ONLY wheel-sourced toolchain piece (AIE codegen)
wheel = "llvm-aie==21.0.0.2026061501+acc2a72c"
index = "https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly"
note  = "LLVM 21 (lags ROCm's 23). Folding the AIE backend onto ROCm LLVM is future work; until then Peano stays a separate wheel."

[hrx]                           # projects/hrx — amdxdna runtime
repo       = "github.com/ROCm/hrx-system"                # canonical ROCm remote (no fork in the chain)
branch     = "users/jtuyls/amdxdna-pathb-aperture-restage"
commit     = "f9c3eb7f4bf289f43e7b44d4d800a043782c6ca5"
hal_driver = "runtime/src/iree/hal/drivers/amdxdna"      # Linux KMQ + Windows MCDM; own shim (no XRT)
note       = "Native amdxdna stack with command-chain capability reporting/fallback, Windows MCDM partial-ELF dispatch support, transaction-ordered resolution of reused buffer descriptors, BD address patching that overwrites baked descriptor addresses instead of double-counting offsets, per-submit restaging and stable non-overlapping placement of cached Windows command-aperture contents, persistent command-code aperture slot placement with Path-B contents restaged from the CPU source of truth on every consume, negotiated legacy/compact Windows MCDM contracts (including Krackan compact/legacy v4), legacy protocol revision 3 support, ABI-hardened HRX-owned amdxdna XADX executable creation, DDI-owned Windows CPU-write publication, device-scoped ordinary Windows BO allocation with context deferral limited to command staging, cached Path-B placements, reusable context-owned persistent command-code aperture slots, range-based cache publication that KMT-invalidates restaged Path-B aperture contents then opcode-9s the exact range consumed by the next state-3/chain submit and SyncBuffers PARTIAL_ELF command-BO tables before miniport read, KMT residency diagnostics, preempt-ELF ERT ABI vocabulary, minimal/relocatable runtime component gating, legacy Windows MCDM driver ABI selection for the 32.0.203.240/.280 stacks while preserving the 32.0.203.314/.329 and newer layouts, explicit asynchronous submission ownership, backend-defined chain-cache retention, fail-closed completion-slot accounting, and fence-ordered Path-B parent retirement before miniport completion readback."

[fastflowlm]                    # projects/FastFlowLM — HRX-native LLM inference engine
repo       = "github.com/ROCm/FastFlowLM"
upstream   = "github.com/FastFlowLM/FastFlowLM"
branch     = "main"
pr         = "FastFlowLM/FastFlowLM#602"
commit     = "a432a07ddc967f3e5b4a45d5ec66adc4eeeebf91"
note       = "HRX-native app path for FastFlowLM 0.9.45 consuming the public HRX amdxdna executable API. All 22 engine libraries are built against that API: the Windows .dll/.lib and the Linux .so, the latter for manylinux_2_28 without Boost runtime dependencies (maximum required GLIBC_2.22 and GLIBCXX_3.4.22). The staging smoke builds this app against projects/hrx and pulls/runs qwen3:0.6b on the NPU."

[eudsl]                         # the one build-time-FETCHED package (the aie.extras layer)
package      = "eudsl-python-extras"
version      = "0.1.0.20260629.149+b27b3ae"              # OVERRIDES mlir-aie's own pin (0.1.0.20260520)
find_links   = "https://llvm.github.io/eudsl"
sha256       = "42157b9bc95fbde97d1bc10aefd268b3bc68bc34af6f97a2dd2cb4c1e751104f"  # sdist (verified on fetch)
mlir_aie_pin = "0.1.0.20260520.827+af15e49"              # what mlir-aie pins (correct for its intended LLVM)
override_via = "patches/iron-tools/0001-eudsl-for-amd-llvm-23.patch"
note         = "TEMPORARY override: mlir-aie's eudsl 04-18 breaks on amd-llvm-23 nanobind (ScalarValue Value(OpResult)); 06-29 fixes it and emits size-identical IR. The patch bumps the version AND repoints mlir-aie's find-links to .cache/find-links; with dev.py's PIP_FIND_LINKS + PIP_NO_INDEX the vendoring is network-free (sha256-verified prefetched sdist). Remove when mlir-aie's Python/IRON path is built against an aligned LLVM."

# Reduced hard deps — all SOURCE-built via the iron-tools submodule (NOT wheels):
#   aie_api -> projects/iron-tools/third_party/aie_api  (AIEOPT_DIR for kernel -I)
#   aie-rt  -> projects/iron-tools/third_party/aie-rt
#   bootgen -> built by iron-tools -> build/iron-tools/bin/bootgen  (build-time only, never runtime)
#   eudsl   -> prefetched + verified (see [eudsl]); the only build-time network fetch
#   xrt     -> NONE at runtime (XRT source used only to build hrx-xclbinutil)
#   peano   -> the only wheel (see [peano])
