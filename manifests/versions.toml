# rocm-npu-staging — version manifest (the pin authority). 2026-06-26.
# Exact revisions the NPU stack is built/validated against. projects/ are
# git submodules; this file records their pins. Build orchestration is in dev.py,
# Python deps in requirements/compiler-stack.txt.
#
# Everything is built FROM SOURCE (submodules) against one ROCm LLVM; Peano
# (llvm-aie) is the ONLY wheel-sourced toolchain piece.

[meta]
host = "linux-x86_64; build + artifact handoff only — on-device run needs an NPU + amdxdna driver"
note = "projects/ are pinned by commit (below); canonical remote URLs are in .gitmodules."

[llvm]                          # projects/llvm-project — ROCm amd-llvm, LLVM 24
repo       = "github.com/ROCm/llvm-project"              # canonical ROCm remote (no fork in the chain)
commit     = "56bcc1871734e6c375a254dec0ec74eb18d04a2e"  # mlir-aie utils/clone-llvm.sh LLVM_PROJECT_COMMIT
branch     = "amd-staging"                               # the commit sits here; pin is the SHA, not the moving tip
llvm_major = 24
train_note = "Deliberate leave of the previous ROCm release train (release/therock-7.14, LLVM 23, 46fcb339 / tag therock-7.14). The pin is still a commit SHA — the LLVM_PROJECT_COMMIT mlir-aie names in utils/clone-llvm.sh — which currently lives on amd-staging as LLVM 24. Not an accidental submodule-tip bump."
patches    = ["patches/llvm-project/0001-link-python-support-to-stable-abi.patch"]
abi3_note  = "0001 makes MLIR's private Python support DLL use Python3::SABIModule when MLIR_ENABLE_PYTHON_STABLE_ABI is enabled; upstream otherwise links Python3_LIBRARY_RELEASE unconditionally on Windows."
win_note   = "Built with the STATIC MSVC runtime on Windows (dev.py passes CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded): mlir-aie sets that unconditionally and lld-link rejects a mixed link. Same CRT upstream builds its own LLVM with (utils/mlir_wheels/setup.py). LLVM_USE_CRT_RELEASE is gone in LLVM 23+."

[iron_tools]                    # projects/iron-tools — built from source against [llvm]
repo     = "github.com/Xilinx/mlir-aie"
commit   = "95b3d1ccc0bfe5183bae1fa9014cfdc1fb4d96c8"    # mlir-aie v1.4.3
provides = ["aie-opt", "aie-translate", "aiecc", "IRON python", "bootgen", "aie_api", "aie-rt", "xclbinutil (vendored third_party/hrx-xclbinutil)"]
note     = "Builds against the same ROCm LLVM pin as mlir-aie utils/clone-llvm.sh (56bcc187, LLVM 24). hrx-xclbinutil is vendored in-tree (mlir-aie #3473), no longer a nested git submodule. v1.4.3 IRON host-runtime allocates HOST_VISIBLE|HOST_CACHED|DEVICE_VISIBLE (0x1A), matching HRX HOST_ONLY."
e2e_design = "programming_examples/basic/matrix_scalar_add"   # the design `dev.py test` builds
e2e_device = "npu2"                                          # -d passed to that design
patches  = ["patches/iron-tools/0001-eudsl-offline-find-links.patch", "patches/iron-tools/0002-windows-clang-cl.patch", "patches/iron-tools/0005-eudsl-download-no-build-isolation.patch", "patches/iron-tools/0006-mlir-core-type-stubs-from-build-tree.patch", "patches/iron-tools/0007-aiecc-capture-stdio-maybe-unused.patch"]
hrx_note = "The former 0003 (HRX IRON host-runtime, aie.utils.hostruntime.hrxruntime — what IRON_RUNTIME=hrx selects) was dropped at this pin: mlir-aie now ships the HRX IRON path upstream, so the patch is redundant. The former 0005 (gate-xrt-scratchpad-binding) was dropped for the same reason — this iron-tools pin already gates the _parameter_scratchpad pybind11 module behind AIE_ENABLE_XRT_PYTHON_BINDINGS upstream. The former 0004 (HostRuntime.cleanup() on the ABC) is now upstream (mlir-aie #3567 and follow-ups), so it was dropped at this pin. The former 0008/0009 (LLVM 23 DenseMapInfo sentinels and arith-expand includeMinMaxF guard) were dropped by aligning this stack's LLVM pin with mlir-aie's clone-llvm.sh commit."
win_note = "0002 is Windows-only in effect (guards keyed on CMake's MSVC var, empty under gcc/clang): gives /EHsc to everything that throws (bootgen, all four test/CppTests, test_utils) because MSVC-style drivers default exceptions off and clang-cl rejects throw outright, and drops -Werror=sign-compare, which aie-rt trips only because MS-ABI enums are signed. Verified a no-op on Linux: build.ninja is byte-identical with and without it."
win_note2 = "0007 marks CaptureStdio's trivial members ([[maybe_unused]]) in tools/aiecc/Utils.h: they are read only inside the tool's #ifndef _WIN32 stdout/stderr-redirect path, so on Windows the constructor/destructor bodies compile out and clang-cl's -Wunused-private-field (promoted by -Werror=unused) fails the native aiecc build. gcc never emits that clang-only diagnostic, so this is a no-op on Linux."

[iron_ops]                      # projects/iron-ops — the IRON operator library (pure Python)
repo     = "github.com/amd/IRON"
commit   = "a279467af0bacde5d7fe3bc5ce67e762386f8aef"  # origin/devel 2026-08-31 (#165)
branch   = "devel"                                              # IRON's default branch; main is an empty initial commit
provides = ["iron.operators (GEMM, MHA, RMSNorm, elementwise, ...)", "aie_kernels C++ sources"]
note     = "Consumes the `aie` package + Peano. Upstream takes both from WHEELS (mlir_aie==1.4.2.dev); here it runs against the SOURCE-built iron-tools ([iron_tools] v1.4.3) and our Peano pin, so its pyproject deps are NOT installed — dev.py installs it --no-deps and requirements/compiler-stack.txt owns numpy/ml_dtypes. WHICH operators are gated (and at what size) is a test matrix, not a pin: build_tools/iron.py OPERATORS (tests/iron-ops/suite.py re-exports it). This pin is required for the mlir-aie Runtime callback-body API (seq_fn) and native aiecc --get-* flags landed in iron-tools 4c8b56f and still present at v1.4.3."
patches  = ["patches/iron-ops/0001-mha-bind-get-current-device.patch", "patches/iron-ops/0002-mem-copy-pass-bit-width.patch"]
drop_note = "The former XRT-free host stack, lazy operator imports, and Windows aiecc copy fallback landed upstream as IRON #165/#163/#162. The former aiecc native CLI patch was already dropped at aab8083: #145/#150 compile through mlir-aie's compile_mlir_module()."
mha_note = "0001 binds MHA compile to get_current_device() like every other operator. a279467 still calls DefaultNPURuntime.device(), which is None under IRON_RUNTIME=cpu. Remove when that one-liner is on IRON devel."
mem_copy_note = "0002 passes -DBIT_WIDTH=16 when compiling mem_copy's passThrough.cc (bf16, same define MHA already sends). mlir-aie v1.4.3 Peano uses -Werror=undef; an unset BIT_WIDTH is a hard error. IRON still targets the 1.4.2.dev wheel. Remove when IRON mem_copy defines BIT_WIDTH."

[peano]                         # the ONLY wheel-sourced toolchain piece (AIE codegen)
wheel = "llvm-aie==21.0.0.2026061501+acc2a72c"
index = "https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly"
note  = "LLVM 21 (lags ROCm's 24). Folding the AIE backend onto ROCm LLVM is future work; until then Peano stays a separate wheel."

[hrx]                           # projects/hrx — amdxdna runtime
repo       = "github.com/ROCm/hrx-system"                # canonical ROCm remote (no fork in the chain)
branch     = "users/jtuyls/amdxdna-hal-native-rel"
commit     = "13990ccf71f059868fc64e115602858ebb880cc9"
hal_driver = "runtime/src/iree/hal/drivers/amdxdna"      # Linux KMQ + Windows MCDM; own shim (no XRT)
reclaim_note = "effecac plus Windows context reclaim: classify IPU-remapped CreateContext 0xc01e0009 as pool exhaustion. XRS reserves one of the architecture-table slots as realtime headroom (PRIV_NUM_RESERVED_RT_CONTEXTS=1), so non-RT HAL creates are capped at budget-1; size the Windows cache there and LRU-evict before CreateContext. 0xc01e0009 retry stays for destroy lag, not as the steady-state full signal."
dev_heap_note = "Linux KMQ publishes its process-wide 64MiB AMDXDNA_BO_DEV_HEAP through the generic shared-code-memory capability, accounts live context images and prepared commands, and reclaims/retries EAGAIN or ENOSPC allocation pressure. Windows MCDM publishes an unbounded shared-code-memory domain because its context images and prepared commands use independent KMT allocations."
multi_device_note = "Linux KMQ shares its process-wide native device handle and 64MiB DEV heap across HAL device instances, allowing generic IREE driver CTS to create devices by ID, ordinal, and path without a second full-heap allocation failing with EBUSY."
note       = "Forwards native-rel through origin/main plus host-test compiler compatibility (MSVC vtable init, GCC field initializers, clang-cl range-loop). Direct executable load uses advertised target family/key (amdxdna/amdxdna). Native amdxdna stack with command-chain capability reporting/fallback, Windows MCDM partial-ELF dispatch support, transaction-ordered resolution of reused buffer descriptors, BD address patching that overwrites baked descriptor addresses instead of double-counting offsets, per-submit restaging and stable non-overlapping placement of cached Windows command-aperture contents, persistent cached partial-ELF staging with publication re-established after chain sessions may overwrite shared aperture storage, negotiated legacy/compact Windows MCDM contracts from UMDRIVERPRIVATE adapter info (kmd_version plus PCI hw_type; compact vs two-DWORD is miniport query size, not SKU), STX2 INF disambiguation between legacy_v2 and legacy, ABI-hardened HRX-owned amdxdna XADX executable creation, DDI-owned Windows CPU-write publication, allocation-level KMT coherency for directly mapped host buffers, device-scoped ordinary Windows BO allocation with context deferral limited to command staging, cached Path-B placements, reusable context-owned persistent command-code aperture slots, non-temporal single-command Path-B restaging, range-based cache publication that always opcode-9s the exact Path-B aperture range consumed by the next state-3/chain submit (including cached reuse of unchanged CPU bytes), shape-compatible PARTIAL_ELF chain reuse, unchanged BO-table synchronization elision, bounded chain-child metadata publication, XRT-style cache-line synchronization for sub-LLC mapped-BO ranges, hardened PARTIAL_ELF descriptor matching against changed TXN/patch bytes, safe cloned descriptor replacement after deferred materialization, empty-patch-table RTP programs kept on the PARTIAL_ELF chain path, KMT residency diagnostics, preempt-ELF ERT ABI vocabulary, minimal/relocatable runtime component gating, legacy Windows MCDM driver ABI selection for the 32.0.203.240/.280 stacks while preserving the 32.0.203.314/.329 and newer layouts, explicit asynchronous submission ownership, backend-defined chain-cache retention, fail-closed completion-slot accounting, and fence-ordered Path-B parent retirement before miniport completion readback."
windows_perf_note = "Avoids native command/BO construction before retained chain-cache lookup, retains compact-ABI command-aperture mappings and range sessions across context switches, publishes contiguous code through its final queue-ordered opcode-9 boundary, queues safe range releases without a CPU wait, and retires asynchronous batches through one final in-order fence plus one completion-ring invalidation."
host_only_note = "Eager command/context caches before device publication. HOST_ONLY is HOST_VISIBLE|HOST_CACHED|DEVICE_VISIBLE (0x1A); HOST_COHERENT and HOST_LOCAL/DEVICE_LOCAL without OPTIMAL are rejected. FastFlowLM Windows HRX engines at [fastflowlm] request 0x1A directly, so the former 0004 HOST_LOCAL|DEVICE_VISIBLE (0x52/0x56) alias is dropped. Reject non-1x1x1 dispatch and unaligned patch addresses."

[fastflowlm]                    # projects/FastFlowLM — HRX-native LLM inference engine
repo       = "github.com/Abhishek-Varma/FastFlowLM_JT"
upstream   = "github.com/ROCm/FastFlowLM"
branch     = "update_hrx_105"
pr         = "ROCm/FastFlowLM#714"
  commit     = "60810c97562d7f63ef525eae74c7aafc96fe356c"
  note       = "FastFlowLM_JT update_hrx_105 @ 60810c97. Multi-model HRX context-exhaustion fix: public package flm-hrx-amdxdna-v2026.09.15 (c023c3e) adds an LRU, capacity-bounded device context cache that evicts and reclaims hardware contexts before the MCDM/kernel context pool exhausts (0xc01e0009 D3DKMTCreateContextVirtual on the Windows 314 driver; amdxdna context-creation failures on Linux), on top of the earlier npu_app executable reference-counting fix that freed executables on model unload. Windows HRX engine dlls/libs (incl. the qwen3vl_flash and gemma4e_flash flash engines) regenerated from IRON fix/hrx-prefill-use-flm-rt @ b218e8b6 against v2026.09.15 and shipped in src/lib/hrx; the optional-engine probe gate AND the FLM_HAS_{QWEN3VL,GEMMA4E}_FLASH conditional-compilation guards are fully removed (@ 60810c97) so the flash model families are hard-wired in (no probe/gate/macro). The 5 base engine libs (dequant, gemm, mha, q4_npu_eXpress, lm_head) are the optimize_qwen3-built versions so the flash MHA attention type is supported (older main-branch mha caused 'MHA type not supported' / empty qwen3vl-flash output). Validated with the ZaneNi FLM_test LLM+vision sweep on a v1.0.5 HRX build: all models incl. gemma4e-flash and qwen3vl-flash (qwen3vl-flash generates on a 2-image prompt), no MHA-not-supported, no 0xc01e0009 context-cache wedges and no crashes. App/catalog follow FLM v1.0.5. HRX buffer.hpp uses shared_ptr ownership so the app ABI matches IRON engines (XRT unique_ptr path unchanged). hy-mt2 (hunyuan) keeps its quiet interactive default (no Model RAW Output echo) but honors FLM_LOG_RAW_OUTPUT=1 via AutoModel::env_forces_raw_output(); qualify and numerical-match set that env so its per-turn responses stay parseable. lib/hrx ships every model engine lib/xrt does on Windows (.dll/.lib); the Linux .so for gemma4e_flash still needs a separate Linux build. Caller XRT_INCLUDE_DIR/XRT_LIB_DIR preference, install-prefix stripping, and Windows redirected stdin stay in patches/FastFlowLM/0001-0003 (applied by `dev.py build fastflowlm` / `fastflowlm-xrt`)."

[eudsl]                         # the one build-time-FETCHED package (the aie.extras layer)
package      = "eudsl-python-extras"
version      = "0.1.0.20260801.905+68a0d7a"              # same pin as mlir-aie python/requirements.txt
find_links   = "https://llvm.github.io/eudsl"
sha256       = "e8672fd1b71c4aba56a80fb724a756337d299a4e706a90ceff435138867213c2"  # sdist (verified on fetch)
find_links_via = "patches/iron-tools/0001-eudsl-offline-find-links.patch"
note         = "Prefetch mlir-aie's own eudsl pin (LLVM is aligned with clone-llvm.sh, so the former 20260629 override is gone). 0001 only rewrites -f from https://llvm.github.io/eudsl to .cache/find-links; with dev.py's PIP_FIND_LINKS + PIP_NO_INDEX the vendoring is network-free (sha256-verified prefetched sdist)."

# Reduced hard deps — all SOURCE-built via the iron-tools submodule (NOT wheels):
#   aie_api -> projects/iron-tools/third_party/aie_api  (AIEOPT_DIR for kernel -I)
#   aie-rt  -> projects/iron-tools/third_party/aie-rt
#   bootgen -> built by iron-tools -> build/iron-tools/bin/bootgen  (build-time only, never runtime)
#   eudsl   -> prefetched + verified (see [eudsl]); the only build-time network fetch
#   xrt     -> NONE at runtime (XRT source used only to build hrx-xclbinutil)
#   peano   -> the only wheel (see [peano])
