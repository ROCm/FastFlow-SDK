name: FLM Windows NPU e2e

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: FLM Windows NPU e2e
      ref:
        type: string
        default: ""
      package_version:
        type: string
        default: ""
      attest_wheels:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      name:
        description: Job display name
        required: false
        default: FLM Windows NPU e2e
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ""
      package_version:
        description: Explicit PEP 440 wheel version
        required: false
        default: ""

# Reusable calls inherit the caller's permission ceiling. CI callers grant
# read-only access; the release caller additionally grants attestation writes.

jobs:
  build:
    name: Build FLM + HRX artifact (Windows)
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 120
    env:
      RNS_BUILD_IMAGE: azure-windows-scale-rocm
      ROCM_NPU_PACKAGE_VERSION: ${{ inputs.package_version }}
    steps:
      - name: Configure git for LF checkouts
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Trust the job checkout
        run: git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Python build tools
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-fastflowlm.lock

      - name: Initialize source pins
        run: python dev.py submodules hrx FastFlowLM --reset --clean hrx FastFlowLM --shallow

      - name: Prepare pinned FlatCC source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content projects/hrx/MODULE.cmake.lock -Raw
          $match = [regex]::Match($lock, 'dvidelabs/flatcc/archive/([0-9a-f]{40})\.tar\.gz')
          if (-not $match.Success) { throw 'FlatCC pin missing from HRX lock file' }
          $commit = $match.Groups[1].Value
          $source = Join-Path $env:RUNNER_TEMP "hrx-flatcc-$commit"
          git init $source
          git -C $source remote add origin https://github.com/dvidelabs/flatcc.git
          git -C $source fetch --depth 1 origin $commit
          git -C $source checkout --detach FETCH_HEAD
          if ((git -C $source rev-parse HEAD).Trim() -ne $commit) { throw 'FlatCC checkout mismatch' }
          "FETCHCONTENT_SOURCE_DIR_FLATCC=$($source.Replace('\', '/'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned
        with:
          toolchain: 1.97.0

      - name: Compute vcpkg ABI scope
        id: vcpkg-abi
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerPath = (Get-Command cl.exe -ErrorAction Stop).Source
          $compilerVersion = (Get-Item -LiteralPath $compilerPath).VersionInfo.FileVersion
          $identity = "$env:RNS_BUILD_IMAGE|$env:ImageOS|$env:ImageVersion|$env:VCToolsVersion|$env:WindowsSdkVersion|$compilerVersion"
          Write-Host "identity=$identity"
          $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $hash = -join ($sha256.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') })
          } finally {
            $sha256.Dispose()
          }
          "key=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore vcpkg download cache
        id: vcpkg-downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-downloads
          key: fastflowlm-vcpkg-v2-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/vcpkg/fastflowlm/vcpkg.json') }}

      - name: Restore vcpkg binary cache
        id: vcpkg-binaries
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-bincache
          key: fastflowlm-vcpkg-v2-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-abi.outputs.key }}-${{ hashFiles('.github/vcpkg/fastflowlm/vcpkg.json', '.github/vcpkg/triplets/x64-windows-rel.cmake') }}
          restore-keys: |
            fastflowlm-vcpkg-v2-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-abi.outputs.key }}-
            fastflowlm-vcpkg-v2-binaries-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up FastFlowLM dependencies
        id: fastflowlm-deps
        run: python dev.py setup --profile fastflowlm

      - name: Install test runner
        run: .venv/Scripts/python.exe -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-test.lock

      - name: Install release validation tools
        run: .venv/Scripts/python.exe -m pip install --disable-pip-version-check --require-hashes -r requirements-release-wheels.lock

      - name: Save vcpkg download cache
        if: success() && steps.fastflowlm-deps.outcome == 'success' && steps.vcpkg-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-downloads
          key: ${{ steps.vcpkg-downloads.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache
        if: success() && steps.fastflowlm-deps.outcome == 'success' && steps.vcpkg-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-bincache
          key: ${{ steps.vcpkg-binaries.outputs.cache-primary-key }}

      - name: Validate and test build tooling
        run: |
          .venv/Scripts/python.exe dev.py doctor fastflowlm
          .venv/Scripts/python.exe -m pytest -m fastflowlm

      - name: Build HRX
        run: .venv/Scripts/python.exe dev.py build hrx --fresh

      - name: Build FastFlowLM
        run: .venv/Scripts/python.exe dev.py build fastflowlm --fresh

      - name: Package runtime
        run: .venv/Scripts/python.exe dev.py package-fastflowlm

      - name: Package rocm-npu runtime wheels
        run: .venv/Scripts/python.exe build_tools/rocm_npu_windows_wheel_cli.py package

      - name: Validate wheel metadata
        run: .venv/Scripts/python.exe -m twine check --strict "build/artifacts/rocm_npu_*.whl"

      - name: Install-test rocm-npu runtime wheels
        run: .venv/Scripts/python.exe build_tools/rocm_npu_windows_wheel_cli.py verify

      - name: Attest Windows wheels
        if: ${{ inputs.attest_wheels }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/artifacts/rocm_npu_*.whl

      - name: Upload runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastflowlm-hrx-windows-x86_64
          path: build/artifacts/fastflowlm-hrx-windows-x86_64.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload rocm-npu runtime wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-runtime-fastflowlm-windows-x86_64
          path: |
            build/artifacts/rocm_npu_runtime-*.whl*
            build/artifacts/rocm_npu_fastflowlm-*.whl*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npu:
    name: ${{ inputs.name }} (${{ matrix.runner_label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - windows-gfx1151-gpu-rocm
          - windows-gfx1152-gpu-rocm
    runs-on: ${{ matrix.runner_label }}
    timeout-minutes: 45
    steps:
      - name: Configure git for LF checkouts
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout test harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Trust the job checkout
        run: git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'

      - name: Download rocm-npu runtime wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocm-npu-runtime-fastflowlm-windows-x86_64
          path: .artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Install and verify rocm-npu runtime wheels
        run: python build_tools/rocm_npu_windows_wheel_cli.py verify --dir .artifact

      - name: Probe NPU driver, firmware, and packaged libHRX
        run: build/rocm-npu-windows-wheel-venv/Scripts/python.exe build_tools/rocm_npu_windows_wheel_cli.py probe

      - name: Run packaged FastFlowLM HRX soak
        run: build/rocm-npu-windows-wheel-venv/Scripts/python.exe build_tools/rocm_npu_windows_wheel_cli.py smoke --inference-iterations 5
