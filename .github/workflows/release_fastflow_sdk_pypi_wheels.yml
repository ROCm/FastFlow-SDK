# SPDX-License-Identifier: MIT
#
# Builds and attests the PyPI fastflow-sdk wheels of a published release: one
# wheel per platform that repacks that release's component wheels unchanged
# (dev.py package-pypi-wheel), then installs them on CPU and NPU runners. CI
# repacks every collected release the same way in
# collect_fastflow_sdk_ci_release.yml. Run this after publishing the GitHub
# release; then upload the wheels from the fastflow-sdk-pypi-wheel-linux and
# -windows artifacts to PyPI with twine.
name: Build FastFlow SDK PyPI wheels for a release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published fastflow-sdk-v* release to repack for PyPI
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build, audit, check, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # The release's SHA256SUMS guards the download; the attestations bind
      # each component wheel to the workflow run that built it.
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            fastflow-sdk-v*) ;;
            *) echo "::error::not a fastflow-sdk release tag: ${RELEASE_TAG}"; exit 1 ;;
          esac
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.whl' --pattern SHA256SUMS --dir release
          for wheel in release/*.whl; do
            gh attestation verify "${wheel}" --repo "${GITHUB_REPOSITORY}" > /dev/null
            echo "attested: ${wheel}"
          done

      - name: Install packaging tools
        run: |
          python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements/release-wheels.lock
          python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements/packaging-linux.lock

      - name: Build the PyPI wheels
        run: |
          set -euo pipefail
          for platform in linux windows; do
            python dev.py package-pypi-wheel --release-dir release --platform "${platform}" --dir pypi
          done

      - name: Audit the Linux PyPI wheel
        run: python dev.py audit-pypi-wheel pypi/fastflow_sdk-*-manylinux_*_x86_64.whl

      - name: Check the PyPI metadata
        run: python -m twine check --strict pypi/*.whl

      - name: Attest the PyPI wheels
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: pypi/*.whl

      # One artifact per platform, so each install job downloads only its wheel.
      - name: Upload the Linux PyPI wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastflow-sdk-pypi-wheel-linux
          path: pypi/fastflow_sdk-*-manylinux_*_x86_64.whl*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload the Windows PyPI wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastflow-sdk-pypi-wheel-windows
          path: pypi/fastflow_sdk-*-win_amd64.whl*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Verify
    needs: build
    uses: ./.github/workflows/verify_fastflow_sdk_pypi_wheels.yml
    permissions:
      contents: read
