#
# Reusable workflow: build the rocm-npu-staging stack from source (LLVM 23 + mlir-aie
# + hrx-xclbinutil + the amdxdna HAL + the FastFlowLM design) and run build-level
# smoke + the FLM e2e (xclbin + HAL PDI artifact-contract check). The ROCm scale
# runner + manylinux build container can do the heavy from-source build.
#
# projects/fastflowlm (ROCm/FastFlowLM) is private; it is fetched with a read-only SSH
# deploy key passed in as the FASTFLOWLM_DEPLOY_KEY secret. The key is written to a
# job-scoped temp file (never ~/.ssh) and shredded in a final always() step. Only
# FastFlowLM is routed over SSH; the public submodules stay on anonymous HTTPS.
name: Build rocm-npu-staging Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build + smoke
    secrets:
      FASTFLOWLM_DEPLOY_KEY:
        required: true
        description: Read-only SSH deploy key for the private ROCm/FastFlowLM submodule.

jobs:
  build_rocm_npu_staging_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    # Cold build compiles LLVM 23 + mlir-aie + the amdxdna HAL from source; ccache
    # (CCACHE_DIR) speeds up warm runs but the first run is long.
    timeout-minutes: 180
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      # The manylinux image has the gcc-toolset but not OpenSSL dev headers, which
      # mlir-aie's bootgen needs (find_package(OpenSSL)).
      - name: Install system build dependencies
        run: dnf install -y openssl-devel || yum install -y openssl-devel

      # FastFlowLM is private: authenticate its fetch with a read-only deploy key kept
      # in a job-scoped temp file. Scope SSH to FastFlowLM only so the public submodules
      # stay on anonymous HTTPS; IdentitiesOnly avoids offering any other agent key.
      - name: Configure FastFlowLM deploy key
        env:
          DEPLOY_KEY: ${{ secrets.FASTFLOWLM_DEPLOY_KEY }}
        run: |
          set -eu
          install -m 600 /dev/null "$RUNNER_TEMP/ffl_deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ffl_deploy_key"
          git config --global core.sshCommand \
            "ssh -i $RUNNER_TEMP/ffl_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config --global url."git@github.com:ROCm/FastFlowLM.git".insteadOf "https://github.com/ROCm/FastFlowLM.git"

      - name: Initialize submodules
        run: |
          git submodule update --init projects/llvm-project projects/hrx projects/hrx-xclbinutil projects/fastflowlm
          git submodule update --init --recursive projects/mlir-aie

      # setup creates .venv, installs the hash-pinned requirements.lock, applies the
      # temporary patches, and prefetches the eudsl sdist (the single network step).
      - name: Setup (venv + hash-pinned deps + prefetch)
        run: python3 dev.py setup

      # Gate: system prereqs (clang/lld/python3-dev) + submodule-pins-vs-manifest
      # (fastflowlm now present, must match its pin) + patches + prefetch + version drift.
      - name: Doctor
        run: .venv/bin/python dev.py doctor

      - name: Build (hrx-xclbinutil, LLVM, mlir-aie, amdxdna HAL, FLM)
        run: |
          .venv/bin/python dev.py build hrx-xclbinutil
          .venv/bin/python dev.py build llvm
          .venv/bin/python dev.py build mlir-aie
          .venv/bin/python dev.py build hrx
          .venv/bin/python dev.py build flm

      # Build-level smoke (no NPU): hrx-xclbinutil packaging round-trip + aie-opt.
      - name: Smoke tests
        run: .venv/bin/python dev.py smoke

      # FLM e2e: build a design xclbin + the HAL PDI artifact-contract check. Needs the
      # fastflowlm source + Peano; runs off-device (no NPU required).
      - name: FLM e2e (xclbin + HAL PDI artifact-contract)
        run: .venv/bin/python dev.py test

      # Always remove the deploy key + its git config, even on failure. The container is
      # ephemeral, but this is belt-and-suspenders for reused self-hosted runners.
      - name: Remove deploy key
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/ffl_deploy_key" 2>/dev/null || rm -f "$RUNNER_TEMP/ffl_deploy_key"
          git config --global --unset core.sshCommand || true
          git config --global --remove-section url."git@github.com:ROCm/FastFlowLM.git" 2>/dev/null || true
