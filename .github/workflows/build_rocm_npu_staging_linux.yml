#
# Reusable workflow: build the rocm-npu-staging stack from source (LLVM 23 + iron-tools
# + hrx-xclbinutil + the amdxdna HAL) and run build-level smoke + the e2e (build an
# iron-tools IRON design -> xclbin + HAL PDI artifact-contract check). The ROCm scale
# runner + manylinux build container can do the heavy from-source build.
#
# Every submodule is public, so they are all fetched over anonymous HTTPS and the
# workflow needs no secrets.
name: Build rocm-npu-staging Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build + smoke
      upload_artifact:
        # Upload the run-prerequisites (built iron-tools + hrx + tools) so a downstream
        # NPU job can run without recompiling. build/llvm is excluded: the iron-tools
        # binaries are statically linked. The Python bindings are not; see the
        # packaging step.
        type: boolean
        default: false

jobs:
  build_rocm_npu_staging_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    # Cold build compiles LLVM 23 + iron-tools + the amdxdna HAL from source; ccache
    # (CCACHE_DIR) speeds up warm runs but the first run is long.
    timeout-minutes: 180
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
      CCACHE_MAXSIZE: 1G   # whole stack is ~0.15 GB of compressed objects; room for a few pins
      RNS_LLVM_BUILD_DIR: ${{ github.workspace }}/build/llvm-cache/gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      # F821 only: a rebase that keeps a call and drops its definition otherwise surfaces
      # as a NameError on the NPU runner, an hour in. No style rules -- this is a
      # correctness gate, not a formatter. Pinned; ruff is a single dependency-free wheel.
      - name: Lint (undefined names)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ruff==0.15.21
          python3 -m ruff check --select F821 dev.py tests

      # The manylinux image has the gcc-toolset but not OpenSSL dev headers, which
      # iron-tools' bootgen needs (find_package(OpenSSL)). Retry: this is the only step
      # that must reach the AlmaLinux mirrors. `yum` is a symlink to `dnf` here, so it
      # is not a fallback.
      - name: Install system build dependencies
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if dnf install -y openssl-devel; then exit 0; fi
            echo "dnf attempt ${attempt} failed; retrying in $(( attempt * 15 ))s"
            dnf clean metadata || true
            sleep $(( attempt * 15 ))
          done
          echo "::error::openssl-devel could not be installed after 5 attempts"
          exit 1

      # --shallow: llvm-project alone is >4 GB of history this build never reads.
      # Only iron-tools needs --clean: its patch adds gitignored files, and a leftover
      # copy makes `git apply` fail. See cmd_submodules.
      # iron-ops is NOT in --clean: unlike iron-tools, its patches modify only tracked files,
      # which --reset restores on its own. (-x would also delete the editable install's
      # egg-info, which `dev.py setup` puts there.)
      - name: Initialize submodules
        run: python3 dev.py submodules llvm-project hrx hrx-xclbinutil iron-tools iron-ops --reset --clean iron-tools --shallow
      # setup creates .venv, installs the hash-pinned requirements.lock, applies the
      # temporary patches, and prefetches the eudsl sdist (the single network step).
      - name: Setup (venv + hash-pinned deps + prefetch)
        run: python3 dev.py setup

      # Gate: system prereqs (gcc/python3-dev) + submodule-pins-vs-manifest
      # + patches + prefetch + version drift.
      - name: Doctor
        run: .venv/bin/python dev.py doctor --toolchain gcc compiler-stack

      - name: Test cross-platform FastFlowLM smoke driver
        run: .venv/bin/python -m unittest discover -s tests/fastflowlm -p 'test_*.py'

      - name: Compute LLVM cache key
        id: llvm-cache-key
        run: |
          set -eu
          llvm_sha="$(git rev-parse HEAD:projects/llvm-project)"
          recipe="$("${PWD}/.venv/bin/python" dev.py llvm-cache-fingerprint --toolchain gcc)"
          {
            echo "sha=$llvm_sha"
            echo "key=llvm-build-${{ runner.os }}-gcc-$llvm_sha-$recipe"
          } >> "$GITHUB_OUTPUT"

      - name: Cache LLVM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.RNS_LLVM_BUILD_DIR }}
          key: ${{ steps.llvm-cache-key.outputs.key }}

      # The runners are ephemeral, so CCACHE_DIR was empty every job and the hit rate was 0.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/build/caches/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build (hrx-xclbinutil, LLVM, iron-tools, amdxdna HAL)
        run: |
          ccache -z
          .venv/bin/python dev.py build --toolchain gcc all

      # Hit rate is the whole point of the step above; print it rather than assume it.
      - name: ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s
          else
            echo "ccache unavailable; an earlier setup step did not complete"
          fi

      # Not part of `build all`: the conformance binaries only run on a machine with an
      # NPU. Built here so npu_e2e gets them from the artifact instead of a toolchain.
      - name: Build amdxdna HAL conformance binaries
        if: ${{ inputs.upload_artifact }}
        run: .venv/bin/python dev.py build --toolchain gcc hrx-cts

      # Build-level smoke (no NPU): hrx-xclbinutil packaging round-trip + aie-opt.
      - name: Smoke tests
        run: .venv/bin/python dev.py smoke

      # e2e: build an iron-tools IRON design's xclbin through Peano + the HAL PDI
      # artifact-contract check. Runs off-device (no NPU required).
      - name: e2e (xclbin + HAL PDI artifact-contract)
        run: .venv/bin/python dev.py test --toolchain gcc

      # The same toolchain, driven by the iron-ops OPERATOR library instead of an iron-tools
      # example: MLIR -> Peano (incl. the operator's own aie_kernels/*.cc) -> xclbin + insts.
      # iron-ops is developed against the mlir_aie WHEEL, so this is where its drift from our
      # source-built aie package shows up — on a CPU runner, minutes in, instead of an hour
      # later on the single gfx1151 box. Which operators: tests/iron-ops/suite.py.
      - name: iron-ops (build operators off-device)
        run: .venv/bin/python dev.py test-iron-ops --toolchain gcc

      # Package + verify live in dev.py so the logic is testable off CI and shared with
      # any other consumer; see cmd_package_npu_prereqs / cmd_verify_npu_prereqs.
      - name: Package run prerequisites
        if: ${{ inputs.upload_artifact }}
        run: .venv/bin/python dev.py package-npu-prereqs

      # Rehearse the NPU job's imports here, off-device: nothing below touches /dev/accel.
      # A broken artifact fails on this runner rather than on the scarce gfx1151 one.
      - name: Verify run prerequisites (off-device)
        if: ${{ inputs.upload_artifact }}
        run: .venv/bin/python dev.py verify-npu-prereqs

      - name: Upload run prerequisites
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npu-prereqs
          path: build/artifacts/npu-prereqs.tar.*   # .zst where zstd exists, else .gz
          if-no-files-found: error
