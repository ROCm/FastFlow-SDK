#
# Reusable workflow: build the rocm-npu-staging stack from source (LLVM 23 + mlir-aie
# + hrx-xclbinutil + the amdxdna HAL) and run build-level smoke tests. The ROCm scale
# runner + manylinux build container can do the heavy from-source build.
#
# NOTE: projects/fastflowlm (ROCm/FastFlowLM) is private and the runner has no
# credentials for it, so it is NOT initialized — the FLM design build and full e2e
# (which need an FLM design) are skipped. To re-enable: give the runner read access
# (PAT/App token/deploy key), add projects/fastflowlm to the submodule init, and run
# `dev.py build flm` + `dev.py test`.
name: Build rocm-npu-staging Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build + smoke

jobs:
  build_rocm_npu_staging_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    # Cold build compiles LLVM 23 + mlir-aie + the amdxdna HAL from source; ccache
    # (CCACHE_DIR) speeds up warm runs but the first run is long.
    timeout-minutes: 180
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      # The manylinux image has the gcc-toolset but not OpenSSL dev headers, which
      # mlir-aie's bootgen needs (find_package(OpenSSL)).
      - name: Install system build dependencies
        run: dnf install -y openssl-devel || yum install -y openssl-devel

      # fastflowlm (private) is intentionally skipped — see the header note.
      - name: Initialize submodules
        run: |
          git submodule update --init projects/llvm-project projects/hrx projects/hrx-xclbinutil
          git submodule update --init --recursive projects/mlir-aie

      # setup creates .venv, installs the hash-pinned requirements.lock, applies the
      # temporary patches, and prefetches the eudsl sdist (the single network step).
      - name: Setup (venv + hash-pinned deps + prefetch)
        run: python3 dev.py setup

      # Gate: system prereqs (clang/lld/python3-dev) + submodule-pins-vs-manifest
      # (fastflowlm shows [absent], not a failure) + patches + prefetch + version drift.
      - name: Doctor
        run: .venv/bin/python dev.py doctor

      - name: Build (hrx-xclbinutil, LLVM, mlir-aie, amdxdna HAL)
        run: |
          .venv/bin/python dev.py build hrx-xclbinutil
          .venv/bin/python dev.py build llvm
          .venv/bin/python dev.py build mlir-aie
          .venv/bin/python dev.py build hrx

      # Build-level tests (no NPU, no FLM): hrx-xclbinutil packaging round-trip + aie-opt.
      - name: Smoke tests
        run: .venv/bin/python dev.py smoke
