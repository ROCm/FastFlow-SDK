# SPDX-License-Identifier: MIT
#
# Reusable workflow: build the rocm-npu-staging stack from source (LLVM 23 + iron-tools
# + hrx-xclbinutil + the amdxdna HAL) and run build-level smoke + the e2e (build an
# iron-tools IRON design -> xclbin + HAL PDI artifact-contract check). The ROCm scale
# runner + manylinux build container can do the heavy from-source build.
#
# Every submodule is public, so they are all fetched over anonymous HTTPS and the
# workflow needs no secrets.
name: Build rocm-npu-staging Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build + smoke
      ref:
        type: string
        default: ""
      package_version:
        type: string
        default: ""
      attest_wheels:
        type: boolean
        default: false
      run_npu_e2e:
        # Package the compiler stack and validate it on the Linux NPU runner.
        type: boolean
        default: false

jobs:
  build_rocm_npu_staging_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    # Cold build compiles LLVM 23 + iron-tools + the amdxdna HAL from source; ccache
    # (CCACHE_DIR) speeds up warm runs but the first run is long.
    timeout-minutes: 180
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      RNS_BUILD_IMAGE: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      ROCM_NPU_PACKAGE_VERSION: ${{ inputs.package_version }}
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      UV_CACHE_DIR: ${{ github.workspace }}/build/caches/uv
      UV_LINK_MODE: hardlink
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
      CCACHE_MAXSIZE: 1G   # whole stack is ~0.15 GB of compressed objects; room for a few pins
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/build/caches/uv
          key: uv-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements*.txt', 'requirements*.lock', 'dev.py', 'build_tools/**/*.py') }}
          restore-keys: uv-v1-${{ runner.os }}-${{ runner.arch }}-

      # F821 only: a rebase that keeps a call and drops its definition otherwise surfaces
      # as a NameError on the NPU runner, an hour in. No style rules -- this is a
      # correctness gate, not a formatter. Pinned; ruff is a single dependency-free wheel.
      - name: Lint (undefined names)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ruff==0.15.21
          python3 -m ruff check --select F821 dev.py build_tools tests

      # The manylinux image has the gcc-toolset but not OpenSSL dev headers, which
      # iron-tools' bootgen needs (find_package(OpenSSL)). Retry: this is the only step
      # that must reach the AlmaLinux mirrors. `yum` is a symlink to `dnf` here, so it
      # is not a fallback.
      - name: Install system build dependencies
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if dnf install -y openssl-devel; then exit 0; fi
            echo "dnf attempt ${attempt} failed; retrying in $(( attempt * 15 ))s"
            dnf clean metadata || true
            sleep $(( attempt * 15 ))
          done
          echo "::error::openssl-devel could not be installed after 5 attempts"
          exit 1

      # --shallow: llvm-project alone is >4 GB of history this build never reads.
      # Only iron-tools needs --clean: its patch adds gitignored files, and a leftover
      # copy makes `git apply` fail. See cmd_submodules.
      # iron-ops is NOT in --clean: unlike iron-tools, its patches modify only tracked files,
      # which --reset restores on its own. (-x would also delete the editable install's
      # egg-info, which `dev.py setup` puts there.)
      - name: Initialize submodules
        run: python3 dev.py submodules llvm-project hrx iron-tools iron-ops --reset --clean iron-tools --shallow
      # setup creates .venv, installs the hash-pinned requirements.lock, applies the
      # temporary patches, and prefetches the eudsl sdist (the single network step).
      - name: Setup (venv + hash-pinned deps + prefetch)
        run: python3 dev.py setup

      - name: Install Linux wheel audit tooling
        run: .venv/bin/python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements-packaging-linux.lock

      # Gate: system prereqs (clang/lld/python3-dev) + submodule-pins-vs-manifest
      # + patches + prefetch + version drift. This is the one full ordered patch
      # replay; Windows uses the quick post-setup check for the same source pins.
      - name: Doctor
        run: .venv/bin/python dev.py doctor compiler-stack --deep

      - name: Test cross-platform FastFlowLM smoke driver
        run: .venv/bin/python -m unittest discover -s tests/fastflowlm -p 'test_*.py'

      - name: Test wheel tooling
        run: .venv/bin/python -m unittest discover -s tests/wheels -p 'test_*.py'

      - name: Test Linux-native tooling
        run: .venv/bin/python -m unittest discover -s tests/linux -p 'test_*.py'

      - name: Test NPU probe diagnostics
        run: .venv/bin/python -m unittest discover -s tests/npu -p 'test_npu_probe.py'

      - name: Test compiler product artifact helpers
        run: .venv/bin/python -m unittest discover -s tests/compiler -p 'test_*.py'

      - name: Test HRX amdxdna ABI declarations
        run: .venv/bin/python -m unittest discover -s tests/hrx -p 'test_*.py'

      # The runners are ephemeral, so CCACHE_DIR was empty every job and the hit rate was 0.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/build/caches/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/versions.toml', 'patches/**/*.patch', 'dev.py', 'build_tools/**/*.py') }}
          restore-keys: ccache-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (hrx-xclbinutil, LLVM, iron-tools, amdxdna HAL)
        run: |
          ccache -z
          .venv/bin/python dev.py build all

      # Hit rate is the whole point of the step above; print it rather than assume it.
      - name: ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s
          else
            echo "ccache unavailable; an earlier setup step did not complete"
          fi

      # Not part of `build all`: the conformance binaries only run on a machine with an
      # NPU. Built here so npu_e2e gets them from the artifact instead of a toolchain.
      - name: Build amdxdna HAL conformance binaries
        if: ${{ inputs.run_npu_e2e }}
        run: .venv/bin/python dev.py build hrx-cts

      # Build-level smoke (no NPU): hrx-xclbinutil packaging round-trip + aie-opt.
      - name: Smoke tests
        run: .venv/bin/python dev.py smoke

      # e2e: build an iron-tools IRON design's xclbin through Peano + the HAL PDI
      # artifact-contract check. Runs off-device (no NPU required).
      - name: e2e (xclbin + HAL PDI artifact-contract)
        run: .venv/bin/python dev.py test

      - name: Package compiler product
        run: .venv/bin/python dev.py package-compiler-product

      - name: Unpack compiler product
        run: .venv/bin/python dev.py unpack-compiler-product --dir build/artifacts

      - name: Verify compiler product relocation
        run: .venv/bin/python dev.py verify-compiler-product --dir build/rocm-npu-compiler-extracted --relocate

      # The same toolchain, driven by the iron-ops OPERATOR library instead of an iron-tools
      # example: MLIR -> Peano (incl. the operator's own aie_kernels/*.cc) -> xclbin + insts.
      # iron-ops is developed against the mlir_aie WHEEL, so this is where its drift from our
      # source-built aie package shows up — on a CPU runner, minutes in, instead of an hour
      # later on the shared NPU runners. Which operators: tests/iron-ops/suite.py.
      - name: iron-ops (build operators off-device)
        run: .venv/bin/python dev.py test-iron-ops --compiler-prefix build/rocm-npu-compiler-relocated/rocm-npu-compiler-linux-x86_64

      # The pinned manylinux image already provides wheel-building interpreters under
      # /opt/python. actions/setup-python does not publish builds for this container OS
      # and fails before it can use the runner tool cache.
      - name: Locate Python 3.13 for compiler wheel validation
        id: python313
        run: |
          python_path=/opt/python/cp313-cp313/bin/python
          test -x "${python_path}"
          echo "python-path=${python_path}" >> "${GITHUB_OUTPUT}"
          "${python_path}" --version

      - name: Locate Python 3.14 for compiler wheel validation
        id: python314
        run: |
          python_path=/opt/python/cp314-cp314/bin/python
          test -x "${python_path}"
          echo "python-path=${python_path}" >> "${GITHUB_OUTPUT}"
          "${python_path}" --version

      - name: Package compiler wheels
        run: |
          .venv/bin/python dev.py package-compiler-wheels \
            --product build/rocm-npu-compiler-product \
            --binding build/iron-tools-install/python

      - name: Audit compiler wheel matrix
        run: .venv/bin/python dev.py audit-compiler-wheels

      - name: Verify compiler wheels on Python 3.12
        run: |
          .venv/bin/python dev.py verify-compiler-wheels \
            --venv build/compiler-wheel-verify-312 \
            --consumer-root build/compiler-wheel-consumer

      - name: Verify compiler wheels on Python 3.13
        run: |
          "${{ steps.python313.outputs.python-path }}" dev.py verify-compiler-wheels \
            --venv build/compiler-wheel-verify-313 \
            --consumer-root build/compiler-wheel-consumer \
            --consumer-only \
            --consumer-e2e

      - name: Verify compiler wheels on Python 3.14
        run: |
          "${{ steps.python314.outputs.python-path }}" dev.py verify-compiler-wheels \
            --venv build/compiler-wheel-verify-314 \
            --consumer-root build/compiler-wheel-consumer \
            --consumer-only \
            --consumer-e2e

      - name: Attest Linux compiler wheels
        if: ${{ inputs.attest_wheels }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/artifacts/rocm_npu_compiler*.whl

      - name: Upload compiler wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-compiler-wheels-linux-x86_64
          path: |
            build/artifacts/rocm_npu_compiler*.whl
            build/artifacts/rocm_npu_compiler*.whl.sha256
            build/artifacts/rocm-npu-compiler-wheel-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # Package + verify live in dev.py so the logic is testable off CI and shared with
      # any other consumer; see cmd_package_npu_prereqs / cmd_verify_npu_prereqs.
      - name: Package run prerequisites
        if: ${{ inputs.run_npu_e2e }}
        run: .venv/bin/python dev.py package-npu-prereqs

      - name: Package prebuilt NPU tests
        if: ${{ inputs.run_npu_e2e }}
        run: .venv/bin/python dev.py package-npu-test-package

      # Rehearse the NPU job's imports here, off-device: nothing below touches /dev/accel.
      # A broken artifact fails on this runner rather than on the scarce gfx1151 one.
      - name: Verify run prerequisites (off-device)
        if: ${{ inputs.run_npu_e2e }}
        run: |
          .venv/bin/python dev.py verify-npu-prereqs
          .venv/bin/python dev.py verify-npu-test-package

      - name: Upload run prerequisites
        if: ${{ inputs.run_npu_e2e }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npu-prereqs-linux-x86_64
          path: build/artifacts/npu-prereqs.tar.*   # .zst where zstd exists, else .gz
          if-no-files-found: error
          # The payload is already zstd/gzip-compressed. Storing it avoids a
          # second ineffective zlib pass and inflate on the NPU runner.
          compression-level: 0

      - name: Upload prebuilt NPU tests
        if: ${{ inputs.run_npu_e2e }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npu-test-package-linux-x86_64
          path: build/artifacts/npu-test-package.tar.*
          if-no-files-found: error
          compression-level: 0

      - name: Upload compiler product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-compiler-linux-x86_64
          path: build/artifacts/rocm-npu-compiler-linux-x86_64.tar.gz*
          if-no-files-found: error
          # The product archive and checksum are already compressed/opaque.
          compression-level: 0

  npu_e2e:
    name: NPU e2e (Linux ${{ matrix.runner_label }})
    if: ${{ inputs.run_npu_e2e }}
    needs: build_rocm_npu_staging_linux
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - linux-gfx1150-gpu-rocm-npu
          - linux-gfx1151-gpu-rocm
          - linux-gfx1152-gpu-rocm
          - linux-gfx1153-gpu-rocm
    runs-on: ${{ matrix.runner_label }}
    timeout-minutes: 60
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      options: >-
        --device=/dev/accel/accel0
        --ulimit memlock=-1:-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trust the job checkout
        run: git config --global --add safe.directory "$PWD"

      - name: Set up NPU test environment
        run: python3 dev.py setup --profile npu-runtime

      - name: Download run prerequisites
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npu-prereqs-linux-x86_64
          path: .artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download prebuilt NPU tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npu-test-package-linux-x86_64
          path: .test-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Extract and verify artifacts
        run: |
          .venv/bin/python dev.py unpack-npu-prereqs --dir .artifact
          .venv/bin/python dev.py verify-npu-prereqs --extracted
          .venv/bin/python dev.py unpack-npu-test-package --dir .test-artifact
          .venv/bin/python dev.py verify-npu-test-package --extracted

      - name: Probe NPU driver and HRX
        run: .venv/bin/python dev.py npu-probe

      - name: Run HRX amdxdna conformance suites
        run: .venv/bin/python dev.py test-hrx-cts

      - name: Run prebuilt XADX NPU tests
        run: .venv/bin/python dev.py test-npu-package
