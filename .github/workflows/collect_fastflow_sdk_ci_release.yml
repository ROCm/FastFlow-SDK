name: Collect fastflow CI release

on:
  workflow_call:
    inputs:
      package_version:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      source_sha:
        type: string
        required: true

jobs:
  collect:
    name: Collect and validate releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download Linux runtime and FastFlowLM wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-runtime-fastflowlm-linux-x86_64
          path: wheelhouse/linux

      - name: Download Windows runtime and FastFlowLM wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-runtime-fastflowlm-windows-x86_64
          path: wheelhouse/windows

      - name: Download Linux compiler wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-compiler-wheels-linux-x86_64
          path: wheelhouse/linux

      - name: Download Windows compiler wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-compiler-wheels-windows-x86_64
          path: wheelhouse/windows

      - name: Download canonical Linux qualification wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-qualification-wheel
          path: wheelhouse/qualification

      - name: Download independently generated Windows qualification wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-qualification-wheel-windows-local
          path: qualification-parity/windows

      - name: Download Linux standalone archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-linux-x86_64
          path: archives/linux

      - name: Download Windows standalone archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflow-sdk-windows-x86_64
          path: archives/windows

      - name: Install release validation tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/release-wheels.lock

      - name: Verify qualification wheel parity
        run: >-
          python build_tools/verify_qualification_wheel_parity.py
          --canonical wheelhouse/qualification
          --candidate qualification-parity/windows

      - name: Validate wheel metadata
        run: python -m twine check --strict wheelhouse/*/*.whl

      - name: Prepare CI release payload
        env:
          FASTFLOW_SDK_PACKAGE_VERSION: ${{ inputs.package_version }}
          FASTFLOW_SDK_SOURCE_REF: ${{ inputs.source_ref }}
          FASTFLOW_SDK_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python build_tools/fastflow_sdk_wheel_release_cli.py prepare \
            --dir wheelhouse \
            --archive-dir archives \
            --output-dir release \
            --version "${FASTFLOW_SDK_PACKAGE_VERSION}" \
            --release-name "CI release ${GITHUB_RUN_ID}" \
            --tag-name "ci-${GITHUB_RUN_ID}" \
            --source-ref "${FASTFLOW_SDK_SOURCE_REF}" \
            --source-sha "${FASTFLOW_SDK_SOURCE_SHA}" \
            --expected-wheel-tag py3-none-any \
            --expected-wheel-tag py3-none-manylinux_2_28_x86_64 \
            --expected-wheel-tag py3-none-linux_x86_64 \
            --expected-wheel-tag py3-none-win_amd64 \
            --expected-wheel-tag cp312-abi3-manylinux_2_28_x86_64 \
            --expected-wheel-tag cp312-abi3-win_amd64
          # Copies into release/ are done; drop duplicate downloads before
          # the multi-target pip resolution loops.
          rm -rf wheelhouse archives qualification-parity

      - name: Create release-wide qualification candidate
        env:
          PYTHONPATH: tools/fastflow-sdk-qualification/python
          FASTFLOW_SDK_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python -m fastflow_sdk_qualification.cli candidate \
            --wheel-dir release \
            --expected-source-revision "${FASTFLOW_SDK_SOURCE_SHA}" \
            --output release/candidate-manifest.json \
            --json

      - name: Resolve qualification dependencies for every supported target
        env:
          FASTFLOW_SDK_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          qualification_wheels=(
            release/fastflow_sdk_qualification-"${FASTFLOW_SDK_PACKAGE_VERSION}"-*.whl
          )
          [[ "${#qualification_wheels[@]}" -eq 1 ]]
          qualification_wheel="${qualification_wheels[0]}"
          test -f "${qualification_wheel}"
          mapfile -t numeric_requirements < <(
            python -c 'import json; from pathlib import Path; contract = json.loads(Path("tools/fastflow-sdk-qualification/python/fastflow_sdk_qualification/numeric-runtime.json").read_text()); print(*(f"{name}=={version}" for name, version in sorted(contract["packages"].items())), sep="\n")'
          )
          for platform in linux windows; do
            if [[ "${platform}" == linux ]]; then
              platform_args=(
                --platform linux_x86_64
                --platform manylinux_2_28_x86_64
              )
            else
              platform_args=(--platform win_amd64)
            fi
            for python_minor in 3.11 3.12 3.13 3.14; do
              python_tag="cp${python_minor/./}"
              target="qualification-release-install-${platform}-${python_tag}"
              python -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-index \
                --find-links release \
                --only-binary=:all: \
                --implementation cp \
                --python-version "${python_minor}" \
                --abi "${python_tag}" \
                "${platform_args[@]}" \
                --target "${target}" \
                "fastflow-sdk-runtime==${FASTFLOW_SDK_PACKAGE_VERSION}" \
                "fastflow-sdk-fastflowlm==${FASTFLOW_SDK_PACKAGE_VERSION}"
              python -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --no-index \
                --no-deps \
                --target "${target}" \
                "${qualification_wheel}"
              python -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --only-binary=:all: \
                --implementation cp \
                --python-version "${python_minor}" \
                --abi "${python_tag}" \
                "${platform_args[@]}" \
                --target "${target}" \
                "${numeric_requirements[@]}"
              python -m build_tools.verify_qualification_dependencies \
                --target "${target}" \
                --version "${FASTFLOW_SDK_PACKAGE_VERSION}"
              rm -rf "${target}"
            done
          done

      - name: Resolve FastFlow SDK meta wheel
        env:
          FASTFLOW_SDK_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          sdk_wheel="release/fastflow_sdk-${FASTFLOW_SDK_PACKAGE_VERSION}-py3-none-any.whl"
          test -f "${sdk_wheel}"
          python -m build_tools.resolve_release_wheel \
            --wheel "${sdk_wheel}" \
            --find-links release \
            --version "${FASTFLOW_SDK_PACKAGE_VERSION}" \
            --product sdk

      - name: Upload validated CI release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastflow-sdk-ci-release-${{ inputs.package_version }}
          path: release/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
