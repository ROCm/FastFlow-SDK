# SPDX-License-Identifier: MIT
name: Release ROCm NPU Wheels

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate; publication requires main history
        required: false
        default: ""
      package_version:
        description: PEP 440 version; defaults to the configured development release train
        required: false
        default: ""
      publish_target:
        description: Where to publish after validation
        required: true
        type: choice
        default: none
        options:
          - none
          - github-prerelease

permissions:
  contents: read

run-name: rocm-npu Linux + Windows wheels ${{ inputs.package_version || 'auto-version' }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release inputs
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
      package_version: ${{ steps.release.outputs.package_version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      release_name: ${{ steps.release.outputs.release_name }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout requested release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Freeze source ref to commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Require reviewed main history
        if: ${{ inputs.publish_target == 'github-prerelease' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "Release workflow must be dispatched from main, got ${GITHUB_REF}" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" origin/main; then
            echo "Release source ${SOURCE_SHA} is not reviewed main history" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Resolve ref and package version
        id: release
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
          INPUT_PUBLISH_TARGET: ${{ inputs.publish_target }}
        run: |
          set -euo pipefail
          python build_tools/rocm_npu_wheel_release_cli.py resolve \
            --ref "${INPUT_REF:-${GITHUB_REF_NAME}}" \
            --package-version "${INPUT_PACKAGE_VERSION}" \
            --publish-target "${INPUT_PUBLISH_TARGET}" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --github-output "${GITHUB_OUTPUT}"

  linux_wheels:
    name: Build and validate Linux wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'none' }}
    uses: ./.github/workflows/fastflowlm_hrx_linux.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Linux wheel release validation
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: false

  windows_wheels:
    name: Build and validate Windows wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'none' }}
    uses: ./.github/workflows/fastflowlm_hrx_windows.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Windows wheel release validation
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: false

  linux_publish_wheels:
    name: Build, validate, and attest Linux wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'github-prerelease' }}
    uses: ./.github/workflows/fastflowlm_hrx_linux.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      name: Linux wheel prerelease
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: true

  windows_publish_wheels:
    name: Build, validate, and attest Windows wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'github-prerelease' }}
    uses: ./.github/workflows/fastflowlm_hrx_windows.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      name: Windows wheel prerelease
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: true

  linux_compiler_wheels:
    name: Build and validate Linux compiler wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'none' }}
    uses: ./.github/workflows/build_rocm_npu_staging_linux.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Linux compiler wheel release validation
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: false
      run_npu_e2e: false

  windows_compiler_wheels:
    name: Build and validate Windows compiler wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'none' }}
    uses: ./.github/workflows/build_rocm_npu_staging_windows.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Windows compiler wheel release validation
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: false
      run_npu_e2e: false

  linux_publish_compiler_wheels:
    name: Build, validate, and attest Linux compiler wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'github-prerelease' }}
    uses: ./.github/workflows/build_rocm_npu_staging_linux.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      name: Linux compiler wheel prerelease
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: true
      run_npu_e2e: false

  windows_publish_compiler_wheels:
    name: Build, validate, and attest Windows compiler wheels
    needs: prepare
    if: ${{ inputs.publish_target == 'github-prerelease' }}
    uses: ./.github/workflows/build_rocm_npu_staging_windows.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      name: Windows compiler wheel prerelease
      ref: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      attest_wheels: true
      run_npu_e2e: false

  collect:
    name: Collect release artifacts
    needs:
      - prepare
      - linux_wheels
      - windows_wheels
      - linux_publish_wheels
      - windows_publish_wheels
      - linux_compiler_wheels
      - windows_compiler_wheels
      - linux_publish_compiler_wheels
      - windows_publish_compiler_wheels
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          (
            inputs.publish_target == 'none' &&
            needs.linux_wheels.result == 'success' &&
            needs.windows_wheels.result == 'success' &&
            needs.linux_compiler_wheels.result == 'success' &&
            needs.windows_compiler_wheels.result == 'success'
          ) ||
          (
            inputs.publish_target == 'github-prerelease' &&
            needs.linux_publish_wheels.result == 'success' &&
            needs.windows_publish_wheels.result == 'success' &&
            needs.linux_publish_compiler_wheels.result == 'success' &&
            needs.windows_publish_compiler_wheels.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download tested Linux wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocm-npu-runtime-fastflowlm-linux-x86_64
          path: wheelhouse/linux

      - name: Download tested Windows wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocm-npu-runtime-fastflowlm-windows-x86_64
          path: wheelhouse/windows

      - name: Download tested Linux compiler wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocm-npu-compiler-wheels-linux-x86_64
          path: wheelhouse/linux

      - name: Download tested Windows compiler wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocm-npu-compiler-wheels-windows-x86_64
          path: wheelhouse/windows

      - name: Install release validation tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-release-wheels.lock

      - name: Validate wheel metadata
        run: python -m twine check --strict wheelhouse/*/*.whl

      - name: Prepare release payload
        shell: bash
        env:
          ROCM_NPU_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          ROCM_NPU_RELEASE_REF: ${{ needs.prepare.outputs.ref }}
          ROCM_NPU_RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          ROCM_NPU_RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
          ROCM_NPU_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          python build_tools/rocm_npu_wheel_release_cli.py prepare \
            --dir wheelhouse \
            --output-dir release \
            --version "${ROCM_NPU_PACKAGE_VERSION}" \
            --release-name "${ROCM_NPU_RELEASE_NAME}" \
            --tag-name "${ROCM_NPU_RELEASE_TAG}" \
            --source-ref "${ROCM_NPU_RELEASE_REF}" \
            --source-sha "${ROCM_NPU_SOURCE_SHA}" \
            --expected-wheel-tag py3-none-any \
            --expected-wheel-tag py3-none-manylinux_2_28_x86_64 \
            --expected-wheel-tag py3-none-linux_x86_64 \
            --expected-wheel-tag py3-none-win_amd64 \
            --expected-wheel-tag cp312-abi3-manylinux_2_28_x86_64 \
            --expected-wheel-tag cp312-abi3-win_amd64

      - name: Resolve FastFlowLM runtime dependency for both platforms
        shell: bash
        env:
          ROCM_NPU_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euo pipefail
          for platform in linux windows; do
            target="release-install-${platform}"
            if [[ "${platform}" == linux ]]; then
              platform_args=(
                --platform linux_x86_64
                --platform manylinux_2_28_x86_64
              )
            else
              platform_args=(--platform win_amd64)
            fi
            python -m pip install \
              --disable-pip-version-check \
              --no-index \
              --find-links release \
              --only-binary=:all: \
              "${platform_args[@]}" \
              --target "${target}" \
              "rocm-npu-fastflowlm==${ROCM_NPU_PACKAGE_VERSION}"
            ROCM_NPU_INSTALL_TARGET="${target}" python - <<'PY'
          import importlib.metadata as metadata
          import os

          version = os.environ["ROCM_NPU_PACKAGE_VERSION"]
          target = os.environ["ROCM_NPU_INSTALL_TARGET"]
          installed = {
              distribution.metadata["Name"]: distribution.version
              for distribution in metadata.distributions(path=[target])
          }
          assert installed == {
              "rocm-npu-fastflowlm": version,
              "rocm-npu-runtime": version,
          }, installed
          PY
          done

      - name: Resolve compiler core and bindings for every supported Python
        shell: bash
        env:
          ROCM_NPU_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euo pipefail
          compiler_meta="release/rocm_npu_compiler-${ROCM_NPU_PACKAGE_VERSION}-py3-none-any.whl"
          test -f "${compiler_meta}"
          for platform in linux windows; do
            for python_minor in 3.12 3.13 3.14; do
              python_tag="cp${python_minor/./}"
              target="compiler-release-install-${platform}-${python_tag}"
              if [[ "${platform}" == linux ]]; then
                platform_args=(--platform manylinux_2_28_x86_64)
              else
                platform_args=(--platform win_amd64)
              fi
              python -m pip install \
                --disable-pip-version-check \
                --find-links release \
                --only-binary=:all: \
                "${platform_args[@]}" \
                --implementation cp \
                --python-version "${python_minor}" \
                --abi "${python_tag}" \
                --abi abi3 \
                --target "${target}" \
                "${compiler_meta}"
              ROCM_NPU_INSTALL_TARGET="${target}" python - <<'PY'
          import importlib.metadata as metadata
          import os

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          from build_tools.rocm_npu_compiler_wheels import (
              COMPILER_BINDINGS_RUNTIME_REQUIREMENTS,
          )

          version = os.environ["ROCM_NPU_PACKAGE_VERSION"]
          target = os.environ["ROCM_NPU_INSTALL_TARGET"]
          installed = {
              canonicalize_name(distribution.metadata["Name"]): distribution.version
              for distribution in metadata.distributions(path=[target])
          }
          expected = {
              "rocm-npu-compiler": version,
              "rocm-npu-compiler-core": version,
              "rocm-npu-compiler-bindings": version,
          }
          for requirement_text in COMPILER_BINDINGS_RUNTIME_REQUIREMENTS:
              requirement = Requirement(requirement_text)
              specifiers = list(requirement.specifier)
              assert len(specifiers) == 1 and specifiers[0].operator == "=="
              expected[canonicalize_name(requirement.name)] = specifiers[0].version
          assert expected.items() <= installed.items(), (expected, installed)
          PY
            done
          done

      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-wheels-${{ needs.prepare.outputs.package_version }}
          path: release/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish_github_prerelease:
    name: Publish GitHub prerelease
    needs:
      - prepare
      - collect
    if: >-
      ${{
        always() &&
        inputs.publish_target == 'github-prerelease' &&
        needs.prepare.result == 'success' &&
        needs.collect.result == 'success'
      }}
    runs-on: ubuntu-24.04
    environment: rocm-npu-prerelease
    permissions:
      contents: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocm-npu-wheels-${{ needs.prepare.outputs.package_version }}
          path: release

      - name: Publish prerelease
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          commit: ${{ needs.prepare.outputs.source_sha }}
          body: |
            Linux and Windows prerelease wheels for the ROCm NPU compiler,
            runtime, and FastFlowLM. Compiler bindings support CPython
            3.12, 3.13, and 3.14.

            Source ref: ${{ needs.prepare.outputs.ref }}
            Source commit: ${{ needs.prepare.outputs.source_sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Install FastFlowLM and its matching runtime dependency with:

            ```console
            python -m pip install --find-links "${{ github.server_url }}/${{ github.repository }}/releases/expanded_assets/${{ needs.prepare.outputs.tag_name }}" rocm-npu-fastflowlm==${{ needs.prepare.outputs.package_version }}
            ```

            Install the matching compiler core and CPython bindings with:

            ```console
            python -m pip install --find-links "${{ github.server_url }}/${{ github.repository }}/releases/expanded_assets/${{ needs.prepare.outputs.tag_name }}" rocm-npu-compiler==${{ needs.prepare.outputs.package_version }}
            ```
          artifacts: "release/*.whl,release/*.sha256,release/SHA256SUMS,release/rocm-npu-release-manifest.json,release/index.html"
          artifactErrorsFailBuild: true
          immutableCreate: true
          prerelease: true
          makeLatest: false
          allowUpdates: false
