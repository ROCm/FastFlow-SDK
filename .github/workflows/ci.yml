#
# Entry workflow: builds + validates the rocm-npu-staging stack via the reusable
# build_rocm_npu_staging_{linux,windows}.yml workflows — Linux (ROCm scale runner +
# TheRock manylinux) and Windows (azure-windows-scale-rocm + clang-cl), same dev.py
# flow. Every submodule is public, so neither needs secrets.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build_rocm_npu_staging_linux.yml
    permissions:
      contents: read
    with:
      name: Build + smoke

  windows:
    name: Windows
    uses: ./.github/workflows/build_rocm_npu_staging_windows.yml
    permissions:
      contents: read
    with:
      name: Build + smoke (Windows)
