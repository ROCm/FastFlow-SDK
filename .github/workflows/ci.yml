#
# Entry workflow: builds + validates the rocm-npu-staging stack on Linux via the
# reusable build_rocm_npu_staging_linux.yml (ROCm scale runner + TheRock manylinux).
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build_rocm_npu_staging_linux.yml
    permissions:
      contents: read
    with:
      name: Build + smoke
    secrets: inherit   # forwards FASTFLOWLM_DEPLOY_KEY to the reusable workflow
