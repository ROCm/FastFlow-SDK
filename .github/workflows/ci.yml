#
# Entry workflow: builds + validates the rocm-npu-staging stack via reusable
# workflows — Linux/Windows compiler-stack and FLM builds, each followed by
# on-device validation on the matching NPU runners.
# Every submodule is public, so none needs secrets.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

# Cancel superseded PR runs: they queue on shared NPU runners. main is exempt
# (run_id makes the group unique), so every landed commit is still validated on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  workflow_lint:
    name: GitHub Actions lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.5"
          cache: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  linux:
    name: Linux
    needs: workflow_lint
    uses: ./.github/workflows/build_rocm_npu_staging_linux.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Build + smoke
      run_npu_e2e: true

  windows:
    name: Windows
    needs: workflow_lint
    uses: ./.github/workflows/build_rocm_npu_staging_windows.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Build + smoke (Windows)
      run_npu_e2e: true

  linux_flm:
    name: Linux FLM
    needs: workflow_lint
    uses: ./.github/workflows/fastflowlm_hrx_linux.yml
    permissions:
      contents: read
      actions: read
    with:
      name: NPU e2e

  windows_flm:
    name: Windows FLM
    needs: workflow_lint
    uses: ./.github/workflows/fastflowlm_hrx_windows.yml
    permissions:
      contents: read
      actions: read
    with:
      name: NPU e2e
