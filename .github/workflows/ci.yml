#
# Entry workflow: builds + validates the rocm-npu-staging stack via reusable
# workflows — Linux/Windows compiler-stack and FLM builds, each followed by
# on-device validation on the matching NPU runners.
# Every submodule is public, so none needs secrets.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

# Cancel superseded PR runs: they queue on shared NPU runners. main is exempt
# (run_id makes the group unique), so every landed commit is still validated on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  presubmit:
    name: Presubmit
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.release-identity.outputs.package_version }}
      run_full_ci: ${{ steps.changes.outputs.run_full_ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/classify_changes.py

      - name: Resolve CI package identity
        id: release-identity
        run: |
          python build_tools/rocm_npu_wheel_release_cli.py resolve \
            --ref "${GITHUB_REF}" \
            --publish-target none \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --github-output "${GITHUB_OUTPUT}"

      # Rule set lives in ruff.toml. Pinned; ruff is a single dependency-free wheel.
      # Submodules under projects/ are excluded. Linux/Windows build jobs do not
      # rerun this: they already need this Presubmit job.
      - name: Lint and format Python
        run: |
          python -m pip install --quiet --disable-pip-version-check ruff==0.15.21
          python -m ruff check
          python -m ruff format --check

      - name: Install test runner
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements/test.lock

      - name: Test developer command core
        run: python -m pytest --basetemp=.pytest-tmp -m presubmit

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.5"
          cache: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  linux:
    name: Linux
    needs: presubmit
    if: needs.presubmit.outputs.run_full_ci == 'true'
    uses: ./.github/workflows/build_rocm_npu_staging_linux.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Build + smoke
      package_version: ${{ needs.presubmit.outputs.package_version }}
      run_npu_e2e: true

  windows:
    name: Windows
    needs: presubmit
    if: needs.presubmit.outputs.run_full_ci == 'true'
    uses: ./.github/workflows/build_rocm_npu_staging_windows.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Build + smoke (Windows)
      package_version: ${{ needs.presubmit.outputs.package_version }}
      run_npu_e2e: true

  linux_flm:
    name: Linux FLM
    needs: presubmit
    if: needs.presubmit.outputs.run_full_ci == 'true'
    uses: ./.github/workflows/fastflowlm_hrx_linux.yml
    permissions:
      contents: read
      actions: read
    with:
      name: NPU e2e
      package_version: ${{ needs.presubmit.outputs.package_version }}
      qualification_artifact: rocm-npu-qualification-wheel
      build_artifacts: true
      run_npu_e2e: true

  windows_flm:
    name: Windows FLM
    needs: presubmit
    if: needs.presubmit.outputs.run_full_ci == 'true'
    uses: ./.github/workflows/fastflowlm_hrx_windows.yml
    permissions:
      contents: read
      actions: read
    with:
      name: NPU e2e
      package_version: ${{ needs.presubmit.outputs.package_version }}
      build_artifacts: true
      run_npu_e2e: true

  collect_releases:
    name: Collect and validate releases
    needs:
      - presubmit
      - linux
      - windows
      - linux_flm
      - windows_flm
    if: >-
      ${{
        always() &&
        needs.presubmit.outputs.run_full_ci == 'true' &&
        !cancelled()
      }}
    uses: ./.github/workflows/collect_rocm_npu_ci_release.yml
    permissions:
      contents: read
      actions: read
    with:
      package_version: ${{ needs.presubmit.outputs.package_version }}
      source_ref: ${{ github.ref }}
      source_sha: ${{ github.sha }}
