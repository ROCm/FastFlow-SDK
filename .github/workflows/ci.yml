#
# Entry workflow: builds + validates the rocm-npu-staging stack via reusable
# workflows — Linux/Windows compiler-stack and FLM builds, each followed by
# on-device validation on the matching gfx1151 NPU runner.
# Every submodule is public, so none needs secrets.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR runs: they queue on the single gfx1151 NPU runner. main is exempt
# (run_id makes the group unique), so every landed commit is still validated on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/build_rocm_npu_staging_linux.yml
    permissions:
      contents: read
    with:
      name: Build + smoke
      run_npu_e2e: true

  windows:
    name: Windows
    uses: ./.github/workflows/build_rocm_npu_staging_windows.yml
    permissions:
      contents: read
    with:
      name: Build + smoke (Windows)
      run_npu_e2e: true

  linux_flm:
    name: Linux FLM
    uses: ./.github/workflows/fastflowlm_hrx_linux.yml
    permissions:
      contents: read
    with:
      name: NPU e2e

  windows_flm:
    name: Windows FLM
    uses: ./.github/workflows/fastflowlm_hrx_windows.yml
    permissions:
      contents: read
    with:
      name: NPU e2e
