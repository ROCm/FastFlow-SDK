name: FLM Linux NPU e2e

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: FLM Linux NPU e2e
      ref:
        type: string
        default: ""
      package_version:
        type: string
        default: ""
      attest_wheels:
        type: boolean
        default: false
      qualification_artifact:
        type: string
        default: ""
      build_artifacts:
        type: boolean
        default: true
      run_npu_e2e:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      name:
        description: Job display name
        required: false
        default: FLM Linux NPU e2e
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ""
      package_version:
        description: Explicit PEP 440 wheel version
        required: false
        default: ""
      build_artifacts:
        description: Build and upload native wheel artifacts
        type: boolean
        default: true
      run_npu_e2e:
        description: Run NPU validation from uploaded artifacts
        type: boolean
        default: true

# Reusable calls inherit the caller's permission ceiling. CI callers grant
# read-only access; the release caller additionally grants attestation writes.

jobs:
  build:
    if: ${{ inputs.build_artifacts }}
    name: Build FLM + HRX artifact (Linux)
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 120
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      RNS_BUILD_IMAGE: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      ROCM_NPU_PACKAGE_VERSION: ${{ inputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Trust the job checkout
        run: git config --global --add safe.directory "$PWD"

      - name: Validate container Python
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Install system build dependencies
        shell: bash
        run: |
          dnf install -y bash ca-certificates curl gcc gcc-c++ git \
            kernel-headers libdrm-devel make nasm patchelf perl perl-IPC-Cmd \
            pkgconf-pkg-config tar unzip which zip zstd

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned
        with:
          toolchain: 1.97.0

      - name: Initialize source pins
        run: python3 dev.py submodules hrx FastFlowLM --reset --clean hrx FastFlowLM --shallow

      - name: Compute vcpkg ABI scope
        id: vcpkg-abi
        shell: bash
        run: |
          ldd_version="$(ldd --version 2>&1)"
          ldd_version="${ldd_version%%$'\n'*}"
          identity="${RNS_BUILD_IMAGE}|$(gcc -dumpmachine)|$(gcc -dumpfullversion -dumpversion)|${ldd_version}"
          echo "identity=${identity}"
          echo "key=$(printf '%s' "${identity}" | sha256sum | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      - name: Restore vcpkg download cache
        id: vcpkg-downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-downloads
          key: fastflowlm-vcpkg-v2-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/vcpkg/fastflowlm/vcpkg.json') }}

      - name: Restore vcpkg binary cache
        id: vcpkg-binaries
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-bincache
          key: fastflowlm-vcpkg-v2-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-abi.outputs.key }}-${{ hashFiles('.github/vcpkg/fastflowlm/vcpkg.json', '.github/vcpkg/triplets/x64-linux-rel.cmake') }}
          restore-keys: |
            fastflowlm-vcpkg-v2-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-abi.outputs.key }}-
            fastflowlm-vcpkg-v2-binaries-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up FastFlowLM dependencies
        id: fastflowlm-deps
        run: python3 dev.py setup --profile fastflowlm

      - name: Install test runner
        run: .venv/bin/python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements/test.lock

      - name: Install Linux wheel audit tooling
        run: .venv/bin/python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements/packaging-linux.lock

      - name: Install release validation tools
        run: .venv/bin/python -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements/release-wheels.lock

      - name: Save vcpkg download cache
        if: success() && steps.fastflowlm-deps.outcome == 'success' && steps.vcpkg-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-downloads
          key: ${{ steps.vcpkg-downloads.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache
        if: success() && steps.fastflowlm-deps.outcome == 'success' && steps.vcpkg-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.cache/vcpkg-bincache
          key: ${{ steps.vcpkg-binaries.outputs.cache-primary-key }}

      - name: Validate and test build tooling
        run: |
          .venv/bin/python dev.py doctor fastflowlm
          .venv/bin/python dev.py doctor fastflowlm-packaging
          .venv/bin/python -m pytest --basetemp=.pytest-tmp -m fastflowlm

      - name: Build HRX
        run: .venv/bin/python dev.py build hrx --fresh

      - name: Build and test native rocm-npu CLI
        run: |
          .venv/bin/python dev.py build rocm-npu-cli --fresh
          .venv/bin/ctest --test-dir build/rocm-npu-cli --output-on-failure

      - name: Build FastFlowLM
        run: .venv/bin/python dev.py build fastflowlm --fresh

      - name: Generate attested FastFlowLM kernel recipe assets
        run: .venv/bin/python dev.py generate-fastflowlm-xadx --fresh

      - name: Build local qualification wheel with generated XADX assets
        run: >-
          .venv/bin/python dev.py package-qualification-wheel
          --version "${{ inputs.package_version }}"
          --xadx-assets build/fastflowlm-xadx-assets
          --dir build/qualification-artifacts

      - name: Package runtime
        run: .venv/bin/python dev.py package-fastflowlm

      - name: Package rocm-npu runtime wheels
        run: .venv/bin/python dev.py package-fastflowlm-wheels

      - name: Audit rocm-npu runtime wheels
        run: .venv/bin/python dev.py audit-fastflowlm-wheels

      - name: Validate wheel metadata
        run: .venv/bin/python -m twine check --strict build/artifacts/rocm_npu_*.whl

      - name: Install-test rocm-npu runtime wheels
        run: .venv/bin/python dev.py verify-fastflowlm-wheels

      - name: Attest Linux release artifacts
        if: ${{ inputs.attest_wheels }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            build/artifacts/rocm_npu_*.whl
            build/artifacts/fastflowlm-hrx-linux-x86_64.tar.zst
            build/qualification-artifacts/rocm_npu_qualification-*.whl

      - name: Upload runtime archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastflowlm-hrx-linux-x86_64
          path: build/artifacts/fastflowlm-hrx-linux-x86_64.tar.zst*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload rocm-npu runtime wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-runtime-fastflowlm-linux-x86_64
          path: |
            build/artifacts/rocm_npu_runtime-*.whl*
            build/artifacts/rocm_npu_fastflowlm-*.whl*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload local qualification wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.qualification_artifact || 'rocm-npu-qualification-wheel' }}
          path: build/qualification-artifacts/rocm_npu_qualification-*.whl*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npu:
    if: >-
      ${{
        always() &&
        inputs.run_npu_e2e &&
        (!inputs.build_artifacts || needs.build.result == 'success')
      }}
    name: ${{ inputs.name }} (${{ matrix.runner_label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner_label: ${{ fromJSON(vars.ROCM_NPU_LINUX_RUNNER_LABELS || '["linux-gfx1150-gpu-rocm-npu","linux-gfx1151-gpu-rocm","linux-gfx1152-gpu-rocm","linux-gfx1153-gpu-rocm"]') }}
    runs-on: ${{ matrix.runner_label }}
    timeout-minutes: 45
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      options: >-
        --device=/dev/accel/accel0
        --ulimit memlock=-1:-1
    steps:
      - name: Checkout test harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Trust the job checkout
        run: git config --global --add safe.directory "$PWD"

      - name: Download rocm-npu runtime wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rocm-npu-runtime-fastflowlm-linux-x86_64
          path: .artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download standalone runtime archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fastflowlm-hrx-linux-x86_64
          path: .native-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download qualification plugin wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.qualification_artifact || 'rocm-npu-qualification-wheel' }}
          path: .qualification-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Install and verify rocm-npu runtime wheels
        run: python3 dev.py verify-fastflowlm-wheels --dir .artifact

      - name: Install qualification plugin wheel and numeric runtime
        run: |
          build/rocm-npu-wheel-venv/bin/python -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            .qualification-artifact/rocm_npu_qualification-*.whl
          build/rocm-npu-wheel-venv/bin/python -m pip check
          build/rocm-npu-wheel-venv/bin/rocm-npu plugin list --json
          build/rocm-npu-wheel-venv/bin/rocm-npu qualify --list-profiles --json

      - name: Probe NPU driver, firmware, and packaged libHRX
        run: build/rocm-npu-wheel-venv/bin/python dev.py npu-probe --runtime-package

      - name: Run native runtime diagnostics and self-test
        run: >-
          python3 build_tools/validate_rocm_npu_cli.py
          --cli build/rocm-npu-wheel-venv/bin/rocm-npu
          --output-dir .native-reports
          --prefix wheel-
          --require-hardware

      - name: Test standalone runtime archive without Python
        shell: bash
        run: |
          set -euo pipefail
          archive="$(realpath "$(find .native-artifact -name 'fastflowlm-hrx-linux-x86_64.tar.zst' -type f -print -quit)")"
          test -n "${archive}"
          (
            cd "$(dirname "${archive}")"
            sha256sum -c "$(basename "${archive}").sha256"
          )
          mkdir -p .native-runtime .native-reports
          (
            cd .native-runtime
            cmake -E tar xvf "${archive}"
          )
          cli="$(find .native-runtime -path '*/bin/rocm-npu' -type f -print -quit)"
          test -x "${cli}"
          "${cli}" version --json > .native-reports/archive-version.json
          "${cli}" probe --json > .native-reports/archive-probe.json
          "${cli}" doctor --json > .native-reports/archive-doctor.json
          if grep -q '"target_family":"npu2"' .native-reports/archive-probe.json; then
            "${cli}" self-test --json > .native-reports/archive-self-test.json
          fi

      - name: Run bounded kernel and model qualification through native dispatch
        run: >-
          build/rocm-npu-wheel-venv/bin/rocm-npu qualify run
          --fast
          --model-cache build/FastFlowLM-models
          --output-dir .qualification-evidence
          --bundle-output .qualification-run.evidence.zip
          --json

      - name: Verify qualification evidence archive
        run: |
          build/rocm-npu-wheel-venv/bin/rocm-npu qualify verify \
            --input .qualification-run.evidence.zip --json

      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-qualification-evidence-${{ matrix.runner_label }}
          path: |
            .qualification-run.evidence.zip
            .qualification-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Upload native CLI hardware reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-native-reports-${{ matrix.runner_label }}
          path: .native-reports/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
