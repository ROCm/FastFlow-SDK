#
# Reusable on-device FastFlowLM smoke for the pinned HRX amdxdna runtime. This
# intentionally builds only projects/hrx and projects/FastFlowLM, then pulls a
# small model and runs a 1k benchmark on the NPU runner.
name: FLM Linux NPU e2e

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: FLM Linux NPU e2e
  workflow_dispatch:
    inputs:
      name:
        description: Job display name
        required: false
        default: FLM Linux NPU e2e

permissions:
  contents: read

jobs:
  fastflowlm_hrx_linux:
    name: ${{ inputs.name }}
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Install system build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo_cmd=()
          if [[ "$(id -u)" != "0" ]]; then
            sudo_cmd=(sudo)
          fi
          if command -v apt-get >/dev/null 2>&1; then
            "${sudo_cmd[@]}" apt-get update
            "${sudo_cmd[@]}" apt-get install -y \
              build-essential \
              cmake \
              curl \
              git \
              libavcodec-dev \
              libavformat-dev \
              libavutil-dev \
              libboost-program-options-dev \
              libcurl4-openssl-dev \
              libdrm-dev \
              libfftw3-dev \
              libreadline-dev \
              libswresample-dev \
              libswscale-dev \
              ninja-build \
              pkg-config \
              python3 \
              python3-venv
          elif command -v dnf >/dev/null 2>&1; then
            "${sudo_cmd[@]}" dnf install -y \
              boost-devel \
              cmake \
              curl \
              fftw-devel \
              ffmpeg-devel \
              gcc \
              gcc-c++ \
              git \
              libcurl-devel \
              libdrm-devel \
              ninja-build \
              pkgconf-pkg-config \
              python3 \
              readline-devel
          else
            echo "No supported package manager found; assuming build dependencies are preinstalled."
          fi

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned
        with:
          toolchain: 1.97.0

      - name: Initialize HRX and FastFlowLM submodules
        run: python3 dev.py submodules hrx FastFlowLM --reset --clean hrx FastFlowLM --shallow

      - name: Set up FastFlowLM dependencies
        run: python3 dev.py setup --profile fastflowlm

      - name: Validate FastFlowLM build prerequisites
        run: .venv/bin/python dev.py doctor fastflowlm

      - name: Test cross-platform FastFlowLM smoke driver
        run: .venv/bin/python -m unittest discover -s tests/fastflowlm -p 'test_*.py'

      - name: Build minimal HRX amdxdna
        run: .venv/bin/python dev.py build hrx

      - name: Probe NPU driver and firmware
        run: .venv/bin/python dev.py npu-probe

      - name: Build FastFlowLM
        run: .venv/bin/python dev.py build fastflowlm

      - name: Run FastFlowLM HRX smoke
        run: .venv/bin/python dev.py test-fastflowlm
