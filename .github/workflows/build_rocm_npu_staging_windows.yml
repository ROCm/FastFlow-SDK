# Copyright Advanced Micro Devices, Inc.
# SPDX-License-Identifier: MIT
#
# Reusable workflow: build the rocm-npu-staging stack from source on WINDOWS — the
# Windows counterpart of build_rocm_npu_staging_linux.yml, kept as consistent with it
# as possible. SAME dev.py command sequence (setup -> doctor -> build all -> smoke ->
# e2e), including the same e2e; steps run in bash (Git Bash is present on the runner)
# so the git/dev.py steps are identical to Linux.
#
# Only OS-forced differences: the azure-windows-scale-rocm runner (no manylinux
# container); clang-cl (from the VS Developer environment, or LLVM) instead of the
# gcc-toolset; OpenSSL from vcpkg instead of dnf openssl-devel (the only system
# library); Python via actions/setup-python; and Windows venv paths (.venv/Scripts).
# cmake/ninja come from pip; ccache is installed below and persisted via actions/cache
# (dev.py routes every compile through it when it is on PATH).
#
# Every submodule is public, so they are all fetched over anonymous HTTPS and the
# workflow needs no secrets.
name: Build rocm-npu-staging Windows

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build + smoke (Windows)
      ref:
        type: string
        default: ""
      package_version:
        type: string
        default: ""
      attest_wheels:
        type: boolean
        default: false
      run_npu_e2e:
        description: Package the compiler stack and validate it on the Windows NPU runner
        type: boolean
        default: false

defaults:
  run:
    shell: bash   # Git Bash on the Windows runner -> git/dev.py steps match Linux

jobs:
  build_rocm_npu_staging_windows:
    name: ${{ inputs.name }}
    runs-on: azure-windows-scale-rocm
    # Cold build compiles LLVM 24 + iron-tools + the amdxdna HAL from source; ccache
    # (CCACHE_DIR) speeds up warm runs but the first run is long.
    timeout-minutes: 180
    env:
      RNS_BUILD_IMAGE: azure-windows-scale-rocm
      ROCM_NPU_PACKAGE_VERSION: ${{ inputs.package_version }}
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      UV_CACHE_DIR: ${{ github.workspace }}/build/caches/uv
      UV_LINK_MODE: hardlink
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
      CCACHE_MAXSIZE: 1G   # whole stack is ~0.15 GB of compressed objects; room for a few pins
      # RNS_LLVM_BUILD_DIR is set in a step below (the `runner` context is not allowed in
      # a job-level env: block) — see "Point the LLVM build tree at the job-scoped temp".
      # OPENSSL_ROOT_DIR is set dynamically from the vcpkg install below (points
      # CMake's find_package(OpenSSL) at it) — see "Install OpenSSL (vcpkg)".
    steps:
      # Git for Windows defaults to core.autocrlf=true, checking files out with CRLF. The
      # patches/ series AND the iron-tools sources they patch are LF, so CRLF makes
      # `git apply` fail ("patch does not apply cleanly"). Force LF for the superproject
      # and every submodule. MUST run before actions/checkout so the .patch files
      # themselves are not CRLF-converted either.
      - name: Configure git for LF checkouts
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      # Python 3.12 for dev.py (tomllib); the manylinux image ships it on Linux.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Newer 3.12 patch releases have no Windows assets in the official
          # actions/python-versions manifest.
          python-version: '3.12.10'

      - name: Restore Python package caches
        id: python-packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ github.workspace }}/build/caches/uv
            ${{ github.workspace }}/build/caches/pip
          key: python-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements/**/*.txt', 'requirements/**/*.lock', 'dev.py', 'build_tools/**/*.py') }}
          restore-keys: |
            python-packages-v2-${{ runner.os }}-${{ runner.arch }}-
            uv-v1-${{ runner.os }}-${{ runner.arch }}-

      # VS Developer environment: puts the MSVC headers/libs + toolchain on PATH.
      - name: Set up MSVC (VS Developer environment)
        uses: ilammy/msvc-dev-cmd@v1   # TODO: SHA-pin
        with:
          arch: x64

      # clang-cl, by choice rather than necessity. The GNU-only syntax that used to rule out
      # `cl` is gone from hrx-xclbinutil (xpdi_compiler.h now guards on _WIN32/__has_attribute),
      # so cl is a live option -- but it is untested here and tends to compile LLVM slower than
      # clang-cl, so we stay on clang-cl until someone measures it.
      # Setting CC/CXX makes dev.py pin the compiler for the CMake builds it drives (and CMake
      # honours CC/CXX for the ones it does not). VS ships clang-cl when the "C++ Clang tools"
      # component is installed; fall back to the LLVM toolchain package if it is not.
      - name: Set up clang-cl
        run: |
          set -eu
          install_llvm() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(choco install --no-progress -y llvm 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              printf '%s\n' "$output"
              case "$output" in
                *NuGetResolverInputException*|*"503 (Service Unavailable)"*)
                  if [ "$attempt" -eq 3 ]; then
                    echo "::error::Chocolatey LLVM lookup remained unavailable after 3 attempts"
                    return 1
                  fi
                  echo "::warning::Transient Chocolatey LLVM lookup failure (attempt $attempt/3) — retrying"
                  sleep $((attempt * 20))
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
          }

          clang_cl="$(command -v clang-cl || true)"
          if [ -z "$clang_cl" ]; then
            vsllvm="$(cygpath -u "${VSINSTALLDIR:-C:/}")VC/Tools/Llvm/x64/bin"
            if [ -x "$vsllvm/clang-cl.exe" ]; then
              export PATH="$vsllvm:$PATH"
            else
              install_llvm
              export PATH="/c/Program Files/LLVM/bin:$PATH"
            fi
            clang_cl="$(command -v clang-cl || true)"
          fi
          if [ -z "$clang_cl" ] || [ ! -x "$clang_cl" ]; then
            echo "::error::clang-cl is unavailable after toolchain setup"
            exit 1
          fi
          clang_cl="$(cygpath -m "$clang_cl")"
          echo "${clang_cl%/*}" >> "$GITHUB_PATH"
          echo "CC=$clang_cl"  >> "$GITHUB_ENV"
          echo "CXX=$clang_cl" >> "$GITHUB_ENV"
          "$clang_cl" --version

      # Build LLVM in the runner's job-scoped temp dir rather than under the workspace.
      # LLVM unconditionally attaches a Windows version resource to every executable
      # (AddLLVM.cmake gates it only on MSVC, which clang-cl also sets), CMake mangles the
      # absolute path of that out-of-tree .rc into the object dir, and the SDK's rc.exe is
      # not long-path aware. Under the workspace the longest target
      # (mlir-bytecode-parser-fuzzer, 88-char object dir) lands at 277 chars -> exceeds
      # MAX_PATH (260) -> "fatal error RC1109: error creating ...". RUNNER_TEMP keeps it at
      # 243, is unique per job and is cleaned up by the runner, so a reused (non-container)
      # host cannot leave a stale tree behind nor two jobs collide. ccache stays in the
      # workspace, so warm rebuilds still work.
      #
      # This must be a step: the `runner` context is rejected in a job-level env: block
      # ("Unrecognized named-value: 'runner'" -> the workflow never runs). Use the
      # RUNNER_TEMP env var instead, forward-slashed so CMake/Python read it cleanly.
      - name: Point the LLVM build tree at the job-scoped temp
        run: echo "RNS_LLVM_BUILD_DIR=${RUNNER_TEMP//\\//}/llvm" >> "$GITHUB_ENV"

      # vcpkg's openssl port builds from source (~3 min); persist its binary-package store so
      # that happens once. `files` provider, not `x-gha`: x-gha uses the legacy cache API.
      - name: Identify vcpkg cache inputs
        id: vcpkg-cache
        run: |
          root="$(dirname "$(command -v vcpkg)")"
          revision="$(git -C "$root" rev-parse HEAD 2>/dev/null || true)"
          if [ -z "$revision" ]; then
            revision="$(vcpkg version | sha256sum | cut -d' ' -f1)"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary packages
        id: vcpkg-binaries
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.revision }}-${{ hashFiles('.github/vcpkg/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-

      # OpenSSL (bootgen's find_package(OpenSSL)) is the ONLY system library dep — the
      # Linux job likewise installs just openssl-devel. Use vcpkg (not choco's openssl,
      # which fetches from slproweb.com — 404s on older versions, flaky in CI). Point
      # find_package(OpenSSL) at the vcpkg tree (forward-slashed so CMake reads it cleanly).
      # cmake + ninja come from pip (the venv).
      - name: Install OpenSSL (vcpkg) for bootgen
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite
        run: |
          set -eu
          mkdir -p .vcpkg-bincache
          # The runner exports the VS-bundled root even though PATH selects C:/vcpkg.
          # Do not leak that conflicting root into vcpkg's CMake subprocesses.
          unset VCPKG_ROOT
          triplets="$PWD/.github/vcpkg/triplets"
          if command -v cygpath >/dev/null; then triplets="$(cygpath -m "$triplets")"; fi

          install_openssl() {
            vcpkg install openssl --triplet x64-windows-rel --overlay-triplets="$triplets"
          }

          # An empty store means vcpkg WILL compile openssl, and that needs Perl on the NATIVE
          # path (Git Bash's is an MSYS binary vcpkg.exe cannot see) -- left to itself vcpkg
          # downloads its own, which has 504'd here. Install it up front in that case only:
          # on a warm store vcpkg just unpacks and never asks for Perl.
          if [ -z "$(ls -A .vcpkg-bincache 2>/dev/null)" ]; then
            if [ ! -x /c/Strawberry/perl/bin/perl.exe ]; then
              choco install --no-progress -y strawberryperl
            fi
            export PATH="/c/Strawberry/perl/bin:$PATH"
            echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
          fi

          # openssl's sources still come over the network; retry transient failures.
          ok=0
          for attempt in 1 2 3; do
            if install_openssl; then ok=1; break; fi
            buildtrees="$(dirname "$(command -v vcpkg)")/buildtrees"
            for log in \
              "$buildtrees"/detect_compiler/config-x64-windows-out.log \
              "$buildtrees"/detect_compiler/config-x64-windows-rel-*.log; do
              if [ -f "$log" ]; then
                echo "::group::$(basename "$log")"
                tail -n 200 "$log"
                echo "::endgroup::"
              fi
            done
            echo "::warning::vcpkg install openssl failed (attempt $attempt/3) — retrying"
            sleep 20
          done
          [ "$ok" -eq 1 ]

          # Discover the vcpkg root from the binary on PATH: this runner does NOT set
          # VCPKG_INSTALLATION_ROOT, and VCPKG_ROOT may point at the VS-bundled vcpkg
          # rather than the one that installed the packages (vcpkg warns + uses its own
          # detected root, e.g. C:\vcpkg). Classic mode installs to <root>/installed.
          root="$(dirname "$(command -v vcpkg)")"
          if command -v cygpath >/dev/null; then root="$(cygpath -m "$root")"; fi   # -> C:/vcpkg (CMake-friendly)
          echo "OPENSSL_ROOT_DIR=$root/installed/x64-windows-rel" >> "$GITHUB_ENV"

      # Persist immediately: later compiler/test failures must not discard the expensive
      # OpenSSL build and force the next retry to install Perl and rebuild it again.
      - name: Save vcpkg binary packages
        if: success() && steps.vcpkg-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: ${{ steps.vcpkg-binaries.outputs.cache-primary-key }}

      # Same submodules as Linux. --depth 1 (fetch only the pinned commit, not full
      # history — big for the LLVM monorepo) + --jobs (clone in parallel): cloning is
      # markedly slower on this runner than on Linux. The build needs the pinned trees,
      # not history; check_pins/patches work on shallow checkouts.
      - name: Initialize submodules
        run: python dev.py submodules llvm-project hrx iron-tools iron-ops --shallow
      # setup creates .venv, installs the pinned requirements (including the Python
      # zstandard codec used to package the compiler product), applies the temporary
      # patches, and prefetches the eudsl sdist (the single network step).
      - name: Setup (venv + pinned deps + prefetch)
        run: python dev.py setup

      - name: Install test runner
        run: .venv/Scripts/python.exe -m pip install --quiet --disable-pip-version-check --require-hashes -r requirements/test.lock

      # Preserve dependency downloads even when a later compiler build or test fails.
      - name: Save Python package caches
        if: success() && steps.python-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ github.workspace }}/build/caches/uv
            ${{ github.workspace }}/build/caches/pip
          key: ${{ steps.python-packages.outputs.cache-primary-key }}

      # Gate: system prereqs (clang-cl/git) + submodule-pins-vs-manifest + patches
      # + prefetch + version drift. Setup already applies the patches; the Linux
      # build performs the one full ordered replay for the shared source pins.
      - name: Doctor
        run: .venv/Scripts/python.exe dev.py doctor compiler-stack

      - name: Test compiler-stack tooling
        run: .venv/Scripts/python.exe -m pytest --basetemp=.pytest-tmp -m "compiler_stack or presubmit"

      # ccache was never installed here, so dev.py silently compiled uncached. It supports
      # clang-cl; Release means no PDBs, so the usual /Z7-vs-PDB caching trap does not apply.
      - name: Install ccache
        run: choco install --no-progress -y ccache

      # Ephemeral runners: without this CCACHE_DIR is empty every job and the hit rate is 0.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/build/caches/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/versions.toml', 'patches/**/*.patch', 'dev.py', 'build_tools/**/*.py') }}
          restore-keys: ccache-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (hrx-xclbinutil, LLVM, iron-tools, amdxdna HAL)
        run: |
          ccache -z
          .venv/Scripts/python.exe dev.py build all --include-tests

      - name: Build amdxdna HAL conformance binaries
        if: ${{ inputs.run_npu_e2e }}
        run: .venv/Scripts/python.exe dev.py build hrx --include-cts

      # Save immediately after compilation so later smoke, packaging, or wheel failures
      # cannot discard a warm LLVM/MLIR object cache.
      - name: Save ccache
        if: success() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/build/caches/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # Print the hit rate rather than assume it. Watch this one: LLVM builds under
      # $RUNNER_TEMP (MAX_PATH workaround), so if that path is not stable across jobs the -I
      # flags differ and every compile misses. If this reads ~0%, that is the cause.
      - name: ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s
          else
            echo "ccache unavailable; an earlier setup step did not complete"
          fi

      # Build-level smoke (no NPU): hrx-xclbinutil packaging round-trip + aie-opt.
      - name: Smoke tests
        run: .venv/Scripts/python.exe dev.py smoke

      # e2e: build an iron-tools IRON design's xclbin through Peano + the HAL PDI
      # artifact-contract check. Runs off-device (no NPU required). Same driver as Linux.
      - name: e2e (xclbin + HAL PDI artifact-contract)
        run: .venv/Scripts/python.exe dev.py test

      - name: Package compiler product
        run: .venv/Scripts/python.exe dev.py package-compiler-product

      - name: Unpack compiler product
        run: .venv/Scripts/python.exe dev.py unpack-compiler-product --dir build/artifacts

      - name: Verify compiler product relocation
        run: .venv/Scripts/python.exe dev.py verify-compiler-product --dir build/rocm-npu-compiler-extracted --relocate

      # Same iron-ops operator build as Linux, same driver. This is the only place the
      # operator library is compiled on Windows at all, so it is also what would catch a
      # POSIX-ism in IRON's compilation rules (it shells out to Peano's clang++ and aiecc).
      # Auto jobs (0 = min(8, CPUs)), one process per operator.
      # NPU e2e later dispatches a CASE_GENERATORS subset via test-npu-package;
      # it does not run iron-ops pytest.
      - name: iron-ops (build operators off-device)
        run: .venv/Scripts/python.exe dev.py test-iron-ops --compiler-prefix build/rocm-npu-compiler-relocated/rocm-npu-compiler-windows-x86_64 --jobs 0

      - name: Set up Python 3.13 for compiler wheel validation
        id: python313
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Python 3.14 for compiler wheel validation
        id: python314
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Package compiler wheels
        run: |
          .venv/Scripts/python.exe dev.py package-compiler-wheels \
            --product build/rocm-npu-compiler-product \
            --binding build/iron-tools-install/python

      - name: Verify compiler wheels on Python 3.12
        run: |
          .venv/Scripts/python.exe dev.py verify-compiler-wheels \
            --venv build/compiler-wheel-verify-312 \
            --consumer-root build/compiler-wheel-consumer

      - name: Verify compiler wheels on Python 3.13
        run: |
          "${{ steps.python313.outputs.python-path }}" dev.py verify-compiler-wheels \
            --venv build/compiler-wheel-verify-313 \
            --consumer-root build/compiler-wheel-consumer \
            --consumer-only \
            --consumer-e2e

      - name: Verify compiler wheels on Python 3.14
        run: |
          "${{ steps.python314.outputs.python-path }}" dev.py verify-compiler-wheels \
            --venv build/compiler-wheel-verify-314 \
            --consumer-root build/compiler-wheel-consumer \
            --consumer-only \
            --consumer-e2e

      # py3-none-any: one wheel, one interpreter. Install into the 3.12 compiler
      # verify venv so we do not pip-install compiler-core a second time. 3.13/3.14
      # already covered the abi3 compiler; ops is the same .py files.
      - name: Package and verify ops wheel
        run: |
          .venv/Scripts/python.exe dev.py package-ops-wheels
          .venv/Scripts/python.exe dev.py verify-ops-wheels \
            --venv build/compiler-wheel-verify-312 \
            --reuse-venv \
            --jobs 0

      - name: Attest Windows compiler wheels
        if: ${{ inputs.attest_wheels }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/artifacts/rocm_npu_compiler_*.whl

      - name: Upload compiler wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-compiler-wheels-windows-x86_64
          path: |
            build/artifacts/rocm_npu_compiler_core*.whl
            build/artifacts/rocm_npu_compiler_core*.whl.sha256
            build/artifacts/rocm_npu_compiler_bindings*.whl
            build/artifacts/rocm_npu_compiler_bindings*.whl.sha256
            build/artifacts/rocm-npu-compiler-wheel-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Package run prerequisites
        if: ${{ inputs.run_npu_e2e }}
        run: .venv/Scripts/python.exe dev.py package-npu-prereqs

      # XADX + NumPy oracles for CASE_GENERATORS (not the full host_compile catalog).
      - name: Package prebuilt NPU tests
        if: ${{ inputs.run_npu_e2e }}
        run: .venv/Scripts/python.exe dev.py package-npu-test-package

      - name: Verify run prerequisites (off-device)
        if: ${{ inputs.run_npu_e2e }}
        run: |
          .venv/Scripts/python.exe dev.py verify-npu-prereqs
          .venv/Scripts/python.exe dev.py verify-npu-test-package

      - name: Upload run prerequisites
        if: ${{ inputs.run_npu_e2e }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npu-prereqs-windows-x86_64
          path: build/artifacts/npu-prereqs.tar.*
          if-no-files-found: error
          # The payload is already gzip-compressed. Storing it avoids a second
          # ineffective zlib pass and the matching inflate on the NPU runner.
          compression-level: 0

      - name: Upload prebuilt NPU tests
        if: ${{ inputs.run_npu_e2e }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npu-test-package-windows-x86_64
          path: build/artifacts/npu-test-package.tar.*
          if-no-files-found: error
          compression-level: 0

      - name: Upload compiler product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rocm-npu-compiler-windows-x86_64
          path: build/artifacts/rocm-npu-compiler-windows-x86_64.tar.zst*
          if-no-files-found: error
          # The product tar.zst and checksum are already compressed/opaque.
          compression-level: 0

  # Execute-only: npu-test-runtime (numpy/ml-dtypes), HRX CTS, prebuilt XADX.
  # No Peano, no torch, no iron-ops pytest (that is local test-npu-iron-ops).
  npu_e2e:
    name: NPU e2e (Windows ${{ matrix.runner_label }})
    if: ${{ inputs.run_npu_e2e }}
    needs: build_rocm_npu_staging_windows
    strategy:
      fail-fast: false
      matrix:
        runner_label: ${{ fromJSON(vars.ROCM_NPU_WINDOWS_RUNNER_LABELS || '["windows-gfx1151-gpu-rocm","windows-gfx1152-gpu-rocm"]') }}
    runs-on: ${{ matrix.runner_label }}
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Configure git for LF checkouts
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trust the job checkout
        run: git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'

      - name: Set up NPU test environment
        run: python dev.py setup --profile npu-test-runtime

      - name: Download run prerequisites
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npu-prereqs-windows-x86_64
          path: .artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download prebuilt NPU tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npu-test-package-windows-x86_64
          path: .test-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Extract and verify artifacts
        run: |
          .venv/Scripts/python.exe dev.py unpack-npu-prereqs --dir .artifact
          .venv/Scripts/python.exe dev.py verify-npu-prereqs --extracted
          .venv/Scripts/python.exe dev.py unpack-npu-test-package --dir .test-artifact
          .venv/Scripts/python.exe dev.py verify-npu-test-package --extracted

      - name: Probe NPU driver and HRX
        run: .venv/Scripts/python.exe dev.py npu-probe

      - name: Run HRX amdxdna conformance suites
        run: .venv/Scripts/python.exe dev.py test-hrx-cts

      - name: Run prebuilt XADX NPU tests
        run: .venv/Scripts/python.exe dev.py test-npu-package
