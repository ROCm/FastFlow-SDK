[pytest]
testpaths =
    tests
    tools/rocm-npu-qualification/tests
addopts = --import-mode=importlib --strict-config --strict-markers
markers =
    presubmit: fast repository and developer-command checks
    compiler_stack: tests supported by the compiler-stack setup profile
    fastflowlm: tests supported by the FastFlowLM setup profile
    linux: tests requiring Linux host semantics
    windows: tests requiring Windows host semantics
